[package]
name = "humanymous-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
autotests = false

[features]
default = ["gateway"]
gateway = ["authority", "audit", "capture", "network", "dep:humanymous-core", "dep:serde", "dep:serde_json", "dep:sha2", "dep:hex", "dep:base64", "dep:getrandom", "dep:zeroize", "dep:socket2", "dep:rustls", "dep:tokio"]
authority = ["audit", "network", "native-security", "dep:humanymous-core", "dep:serde", "dep:serde_json", "dep:sha2", "dep:hex", "dep:base64", "dep:subtle", "dep:ed25519-dalek", "dep:getrandom", "dep:zeroize", "dep:tokio", "dep:rustix", "dep:interprocess", "dep:widestring"]
audit = ["native-security", "dep:humanymous-core", "dep:serde", "dep:serde_json", "dep:sha2", "dep:hex", "dep:subtle", "dep:ed25519-dalek", "dep:unicode-normalization", "dep:hmac", "dep:base64", "dep:getrandom", "dep:zeroize", "dep:time", "dep:aes-gcm", "dep:scrypt", "dep:rustix"]
capture = ["network", "dep:rustls", "dep:httlib-hpack"]
network = ["dep:humanymous-core", "dep:serde", "dep:serde_json", "dep:sha2", "dep:md-5", "dep:hex"]
native-security = ["dep:zeroize", "dep:rustix", "dep:winsafe", "dep:windows-permissions", "dep:keyring-core", "dep:windows-native-keyring-store"]
hosted-pilot = ["capture", "dep:rcgen"]
credential-pilot = ["native-security"]

[dependencies]
humanymous-core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
socket2 = { version = "0.6.5", optional = true }
rustls = { optional = true, version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
httlib-hpack = { version = "=0.1.3", optional = true }
rcgen = { version = "=0.14.10", optional = true, default-features = false, features = ["crypto", "ring"] }
tokio = { optional = true, version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
humanymous-collector = { path = "../../collector", version = "0.1.0" }
humanymous-platform = { workspace = true, features = ["testing"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(any(unix, windows))'.dependencies]
time = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { optional = true, version = "1.1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-permissions = { version = "=0.2.4", optional = true }
winsafe = { optional = true, version = "=0.0.29", features = ["kernel", "advapi"] }
keyring-core = { optional = true, version = "=1.0.1", default-features = false }
windows-native-keyring-store = { optional = true, version = "=1.1.0", default-features = false }
widestring = { version = "1.2.1", optional = true }
interprocess = { optional = true, version = "=2.4.7", features = ["tokio"] }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "=2.1.0", default-features = false }

[lints]
workspace = true

[[bin]]
name = "humanymous-runtime"
path = "src/gateway/main.rs"
required-features = ["gateway"]

[[bin]]
name = "humanymous-authority"
path = "src/authority/main.rs"
required-features = ["authority"]

[[bin]]
name = "audit-witness"
path = "src/audit/bin/audit-witness.rs"
required-features = ["audit"]

[[bin]]
name = "audit-control-retainer"
path = "src/audit/bin/audit-control-retainer.rs"
required-features = ["audit"]

[[test]]
name = "gateway-native-process"
path = "tests/gateway/native_process.rs"
required-features = ["gateway"]

[[test]]
name = "authority-decisions"
path = "tests/authority/decisions.rs"
required-features = ["authority"]

[[test]]
name = "authority-local-service"
path = "tests/authority/local_service.rs"
required-features = ["authority"]

[[test]]
name = "authority-native-process"
path = "tests/authority/native_process.rs"
required-features = ["authority"]

[[test]]
name = "audit-checkpoint-parity"
