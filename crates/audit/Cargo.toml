[package]
name = "humanymous-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sha2.workspace = true
unicode-normalization.workspace = true
serde.workspace = true
serde_json.workspace = true
humanymous-core.workspace = true
hex.workspace = true
hmac.workspace = true
subtle.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
humanymous-test-support.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
getrandom.workspace = true
time.workspace = true
base64.workspace = true
aes-gcm.workspace = true
scrypt.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
humanymous-native-security.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-permissions = "=0.2.4"
junction = { version = "=2.1.0", default-features = false }

