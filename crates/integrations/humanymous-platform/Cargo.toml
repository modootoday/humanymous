[package]
name = "humanymous-platform"
description = "Isolated Humanymous platform bindings and explicit qualification helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]

[features]
default = []
testing = ["dep:serde", "dep:serde_json"]
windows-object = ["dep:windows-sys", "dep:windows-permissions"]
# Root-accepted B1 descriptor-at-create FILE primitive (structural-development SoT);
# the only function-local unsafe scope it adds is create_file::create_native.
windows-file-create = ["windows-object"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
windows-permissions = { version = "=0.2.4", optional = true }

[[example]]
name = "linux_tree_inventory"
path = "examples/linux_tree_inventory.rs"
required-features = ["testing"]

# Function-local Windows bridge exceptions: the original six, N2 stdin_is_pipe (D3)
# and, behind windows-file-create, B1 create_file::create_native.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
