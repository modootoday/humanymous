[package]
name = "humanymous-native-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
credential-pilot = []

[dependencies]
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
humanymous-windows-object-bridge.workspace = true
windows-permissions = "=0.2.4"
winsafe = { version = "=0.0.29", features = ["kernel", "advapi"] }
keyring-core = { version = "=1.0.1", default-features = false }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true
