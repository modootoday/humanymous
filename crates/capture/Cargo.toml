[package]
name = "humanymous-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
hosted-pilot = ["dep:rcgen"]

[dependencies]
humanymous-network = { path = "../network", version = "0.1.0" }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
httlib-hpack = "=0.1.3"
rcgen = { version = "=0.14.10", optional = true, default-features = false, features = ["crypto", "ring"] }

[[test]]
name = "hosted_transport"
required-features = ["hosted-pilot"]

[lints]
workspace = true
