[package]
name = "humanymous-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

[features]
service-pilot = []
runtime-service = ["dep:humanymous-runtime", "dep:humanymous-authority", "dep:tokio", "dep:zeroize"]
runtime-service-pilot = ["runtime-service", "humanymous-native-security/credential-pilot", "dep:humanymous-audit"]

[[bin]]
name = "humanymous"
path = "src/main.rs"

[[bin]]
name = "humanymous-service-fixture"
path = "src/bin/service_fixture.rs"
required-features = ["service-pilot"]

[dependencies]
sha2.workspace = true
humanymous-native-security.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
humanymous-runtime = { path = "../runtime", optional = true }
humanymous-authority = { path = "../authority", optional = true }
humanymous-audit = { path = "../audit", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "signal"], optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"

[lints]
workspace = true

[dev-dependencies]
humanymous-test-support.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-permissions = "=0.2.4"
junction = { version = "=2.1.0", default-features = false }
