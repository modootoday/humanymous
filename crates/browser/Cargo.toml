[package]
name = "humanymous-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
native-ui = ["dep:meari", "dep:meari-native", "dep:html5ever", "dep:meari-dom"]

[dependencies]
meari-dom = { git = "https://github.com/modootoday/meari.git", rev = "1482b746ebc0d867f25d17d01c48c12df888ca6c", default-features = false, optional = true }
html5ever = { version = "=0.40.1", optional = true }
url = "=2.5.7"
meari = { git = "https://github.com/modootoday/meari.git", rev = "1482b746ebc0d867f25d17d01c48c12df888ca6c", optional = true }
meari-native = { git = "https://github.com/modootoday/meari.git", rev = "1482b746ebc0d867f25d17d01c48c12df888ca6c", default-features = false, features = ["window"], optional = true }

[dev-dependencies]
accesskit = "=0.25.1"
blitz-traits = "=0.3.0-beta.4"
keyboard-types = "=0.8.3"

[[bin]]
name = "humanymous-browser"
path = "src/main.rs"
required-features = ["native-ui"]
