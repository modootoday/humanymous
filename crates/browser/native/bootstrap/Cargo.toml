[package]
name = "humanymous-cef-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[features]
native-pilot-tests = []

[lib]
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "deny"

[target.'cfg(windows)'.dependencies]
cef = { git = "https://github.com/tauri-apps/cef-rs.git", rev = "bacdb41c17f30f4eca4a6f747586fbf7f280ab90", default-features = false, features = ["sandbox"] }
libloading = "=0.9.1"

[target.'cfg(windows)'.dev-dependencies]
humanymous-platform = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
