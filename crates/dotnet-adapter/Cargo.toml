[package]
name = "humanymous-dotnet-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "Cargo.toml", "INTEGRATION.md"]

[dependencies]
humanymous-runtime = { workspace = true, features = ["authority"] }
humanymous-framework-adapter = { path = "../framework-adapter" }
humanymous-core.workspace = true
humanymous-native-abi = { path = "../native-abi" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
humanymous-runtime = { workspace = true, features = ["audit", "native-security"] }
humanymous-core.workspace = true
humanymous-platform = { workspace = true, features = ["testing"] }
sha2.workspace = true

[lints]
workspace = true
