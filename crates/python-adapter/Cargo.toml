[package]
name = "humanymous-python-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "humanymous_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:pyo3", "dep:pyo3-async-runtimes"]
extension-module = ["native", "pyo3/extension-module"]
host-pilot = ["native"]
package-tool = ["native"]

[dependencies]
humanymous-framework-adapter = { path = "../framework-adapter" }
humanymous-authority = { path = "../authority" }
humanymous-integrity = { path = "../integrity" }
pyo3 = { version = "=0.30.1", optional = true }
pyo3-async-runtimes = { version = "=0.30.0", features = ["tokio-runtime"], optional = true }
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[bin]]
name = "humanymous-python-package"
path = "src/bin/humanymous-python-package.rs"
required-features = ["package-tool"]
