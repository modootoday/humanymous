[package]
name = "humanymous-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
humanymous-core.workspace = true
humanymous-audit = { path = "../audit" }
humanymous-network = { path = "../network" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
subtle.workspace = true
getrandom.workspace = true
zeroize.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
humanymous-native-security.workspace = true
widestring = "1.2.1"
interprocess = { version = "=2.4.7", features = ["tokio"] }

[target.'cfg(windows)'.dev-dependencies]
windows-permissions = "=0.2.4"
