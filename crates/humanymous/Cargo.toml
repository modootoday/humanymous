[package]
name = "humanymous"
description = "Humanymous public Rust library facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = ["crates-io"]
autobins = false

[features]
default = []
adapter-go = ["dep:humanymous-adapter-go"]

[dependencies]
humanymous-adapter-go = { path = "../go-adapter", version = "0.1.0", optional = true }

[dev-dependencies]
serde_json.workspace = true
toml = "=1.2.1"

[lints]
workspace = true
