[package]
name = "humanymous-ruby-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "humanymous_ruby"
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:magnus"]
package-tool = ["native"]
host-pilot = ["native"]

[dependencies]
humanymous-framework-adapter = { path = "../framework-adapter" }
humanymous-runtime = { workspace = true, features = ["authority"] }
humanymous-core.workspace = true
magnus = { version = "=0.9.3", features = ["bytes"], optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
