[package]
name = "humanymous-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
humanymous-authority = { path = "../authority" }
humanymous-audit = { path = "../audit" }
humanymous-capture = { path = "../capture" }
humanymous-challenge = { path = "../challenge" }
humanymous-integrity = { path = "../integrity" }
humanymous-network = { path = "../network" }
humanymous-scoring = { path = "../scoring" }
humanymous-signals.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
getrandom.workspace = true
zeroize.workspace = true
socket2 = "0.6.5"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
humanymous-collector = { path = "../collector" }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
