# Multi-provider agent layout inventory (canon).
version: 6

shared_worktree:
  root: 'C:\workspaces\humanymous'
  branch: codex/rust
  actual_branch_check_before_every_write: true
  create_or_switch_branches: false
  create_worktrees: false
  recreate_deleted_validation_refs: false
  owner_push_or_delete_refs: false
  root_isolated_source: read-only-to-other-owners
  candidate_writes: claimed-evidence-paths-only
  generated_policy_projection: direct-canonical-AGENTS-entrypoint

authored_source_exceptions:
  - decision: .spec/sot/rust-migration.sot.md#explicit-managed-host-exception-aspnet-core
    language: CSharp
    paths:
      - adapters/dotnet/src/Humanymous.Native/NativeBinding.cs
      - adapters/dotnet/src/Humanymous.Native/HumanymousMiddleware.cs
      - adapters/dotnet/pilot/Program.cs
    scope: ABI-binding-middleware-host-pilot-only
    runtime_qualified: false

canon:
  project_rules: AGENTS.md
  nested_agents:
    - internal/AGENTS.md
    - cmd/gate/AGENTS.md
    - docs/AGENTS.md
    - test/AGENTS.md
    - web/AGENTS.md
  rules_root: .agents/rules
  skills_root: .agents/skills
  agents_root: .agents/agents
  workflows_root: .agents/workflows
  evals:
    dataset: .agents/evals/trigger-queries.json
    deterministic_rules: .agents/evals/trigger-rules.json
    runner: skills/agent-maintenance
    product_suite: .agents/evals/product
  hooks_canon: .agents/hooks
  workflow_runtime: scripts/agents/workflow-runner.mjs
  workflow_schema: .agents/workflows/workflow.schema.json
  run_schema: .agents/workflows/run.schema.json

adapters:
  cursor:
    project_rules: [AGENTS.md]
    rules: [.agents/rules/95-cursor-collaboration.md]
    entrypoint: .cursor/rules/humanymous-collaboration.mdc
    discovery_qualified: false
    git_identity: actual-registered-model-provider
  claude:
    project_rules: [AGENTS.md]
    skills: .agents/skills
    rules: .agents/rules
    agents: .agents/agents
    discovery_qualified: false
    settings: .claude/settings.json
  grok:
    project_rules: [AGENTS.md]
    skills: .agents/skills
    rules: .agents/rules
    discovery_qualified: false
    hooks: .grok/hooks/project-safety.json
  codex:
    project_rules: [AGENTS.md]
    skills: .agents/skills
    discovery_qualified: false
    hooks: .codex/hooks.json
  gemini:
    project_rules: [AGENTS.md]
    settings: .gemini/settings.json
    skills: .agents/skills
    discovery_qualified: false

rules:
  - 00-safety.md
  - 10-rust-conventions.md
  - 20-detection-freeze.md
  - 30-docs-diataxis.md
  - 40-ambiguity-ask.md
  - 50-provider-matrix.md
  - 60-e2e-docker-only.md
  - 61-redblue-wargame.md
  - 70-hard-won-lessons.md
  - 80-truth-debt.md
  - 90-session-overlap.md
  - 91-git-contention.md
  - 92-git-commit-attribution.md
  - 93-release-and-ci.md
  - 94-chat-coordination.md
  - 95-cursor-collaboration.md
  - 96-docker-engine-affinity.md

sessions:
  protocol: .agents/sessions/PROTOCOL.md
  git_protocol: .agents/sessions/GIT-PROTOCOL.md
  commit_convention: .agents/sessions/COMMIT-CONVENTION.md
  lanes: .agents/sessions/LANES.md
  board: .agents/sessions/ACTIVE.md  # gitignored live state

lessons:
  - HARD-WON.md
  - PROVIDER-HISTORY.md
  - CODEX-AUTO-APPROVE.md

skills:
  - design-sot
  - adversarial-critique
  - implement-sot-slice
  - red-blue-validate
  - red-blue-wargame-round
  - pass-wargame-round
  - docs-from-sot
  - cut-release
  - github-actions-ops
  - review-changes
  - handover-pack
  - optimize-skill-description
  - survey-provider-history
  - coordinate-sessions

agents:
  - blue-architect
  - red-attacker
  - sre-ops
  - compliance-dpo
  - evaluator
  - staff-synthesizer

workflows:
  - feature-loop.yaml
  - design-panel.yaml
  - session-overlap.yaml

research_basis:
  - https://agents.md/
  - https://agentskills.io/skill-creation/best-practices
  - https://agentskills.io/skill-creation/optimizing-descriptions
  - nested AGENTS progressive disclosure / monorepo patterns
  - L0 hooks for deterministic safety (Claude settings + Grok hooks)

transition:
  policy: .agents/retirement/README.md
  manifest: .agents/retirement/manifest.json
  user_skills: external-read-only
  generated_mirror_deletion: root-owned-cleanup-candidate
  regenerate_mirrors: false
  provider_discovery: pending-source-bound-evaluation
  authored_toolchain: Rust-1.99.1-edition-2024
