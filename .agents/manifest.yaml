# Multi-provider agent layout inventory (canon).
version: 4

canon:
  project_rules: AGENTS.md
  nested_agents:
    - internal/AGENTS.md
    - cmd/gate/AGENTS.md
    - docs/AGENTS.md
    - test/AGENTS.md
    - web/AGENTS.md
  rules_root: .agents/rules
  skills_root: .agents/skills
  personas_root: .agents/personas
  workflows_root: .agents/workflows
  evals:
    dataset: .agents/evals/trigger-queries.json
    deterministic_rules: .agents/evals/trigger-rules.json
    runner: scripts/agents/eval-skill-triggers.mjs
  hooks_canon: .agents/hooks
  workflow_runtime: scripts/agents/workflow-runner.mjs
  workflow_schema: .agents/workflows/workflow.schema.json
  run_schema: .agents/workflows/run.schema.json

adapters:
  claude:
    project_rules: [CLAUDE.md]
    skills: .claude/skills
    rules: .claude/rules
    agents: .claude/agents
    settings: .claude/settings.json
  grok:
    project_rules: [AGENTS.md]
    skills: [.agents/skills, .grok/skills]
    rules: .grok/rules
    hooks: .grok/hooks/project-safety.json
  codex:
    project_rules: [AGENTS.md]
    skills: .codex/skills
    hooks: .codex/hooks.json
  gemini:
    project_rules: [AGENTS.md]
    settings: .gemini/settings.json
    skills: [.agents/skills, .gemini/skills]

rules:
  - 00-safety.md
  - 10-go-conventions.md
  - 20-detection-freeze.md
  - 30-docs-diataxis.md
  - 40-ambiguity-ask.md
  - 50-provider-matrix.md
  - 60-e2e-docker-only.md
  - 70-hard-won-lessons.md
  - 80-truth-debt.md
  - 90-session-overlap.md
  - 91-git-contention.md
  - 92-git-commit-attribution.md
  - 93-release-and-ci.md

sessions:
  protocol: .agents/sessions/PROTOCOL.md
  git_protocol: .agents/sessions/GIT-PROTOCOL.md
  commit_convention: .agents/sessions/COMMIT-CONVENTION.md
  lanes: .agents/sessions/LANES.md
  board: .agents/sessions/ACTIVE.md  # gitignored live state

lessons:
  - HARD-WON.md
  - PROVIDER-HISTORY.md
  - CODEX-AUTO-APPROVE.md

skills:
  - design-sot
  - adversarial-critique
  - implement-sot-slice
  - red-blue-validate
  - pass-wargame-round
  - docs-from-sot
  - cut-release
  - github-actions-ops
  - review-changes
  - handover-pack
  - optimize-skill-description
  - survey-provider-history
  - coordinate-sessions

personas:
  - blue-architect
  - red-attacker
  - sre-ops
  - compliance-dpo
  - evaluator
  - staff-synthesizer

workflows:
  - feature-loop.yaml
  - design-panel.yaml
  - session-overlap.yaml

research_basis:
  - https://agents.md/
  - https://agentskills.io/skill-creation/best-practices
  - https://agentskills.io/skill-creation/optimizing-descriptions
  - nested AGENTS progressive disclosure / monorepo patterns
  - L0 hooks for deterministic safety (Claude settings + Grok hooks)
