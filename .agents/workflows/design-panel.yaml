# Multi-perspective design panel → synthesis → adversarial critique
id: design-panel
version: 1
description: >
  Parallel persona survey for a significant design decision, then one synthesis
  SoT/plan draft and one adversarial completeness pass.

phases:
  - id: brief
    action: Fix problem statement, constraints, and non-goals in 10–15 lines.
    timeout_minutes: 15
    max_retries: 1
    approval: none
    exit: Shared brief all personas use

  - id: panel
    parallel: true
    timeout_minutes: 45
    max_retries: 1
    approval: none
    personas:
      - blue-architect
      - red-attacker
      - sre-ops
      - compliance-dpo
      - evaluator
    each_produces:
      - findings (severity H/M/L)
      - evidence (file path, SoT id, or threat)
      - open questions
    exit: Per-persona finding lists

  - id: synthesize
    persona: staff-synthesizer
    skill: design-sot
    timeout_minutes: 30
    max_retries: 1
    approval: required
    exit: Single SoT or plan draft; contradictions resolved or marked residual

  - id: adversarial
    skill: adversarial-critique
    timeout_minutes: 30
    max_retries: 1
    approval: none
    exit: Weakest assumptions listed; must-fix items reflected in draft before implement
