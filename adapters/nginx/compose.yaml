services:
  native-pilot:
    image: humanymous-nginx-native:local
    build:
      context: ../..
      dockerfile: adapters/nginx/Dockerfile.native
      target: lab
    network_mode: none
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
