services:
  native-pilot:
    image: ${HUMANYMOUS_NGINX_IMAGE:?source-bound local image tag required}
    build:
      context: ../..
      dockerfile: adapters/nginx/Dockerfile.native
      target: lab
      args:
        HUMANYMOUS_SOURCE_REV: ${HUMANYMOUS_SOURCE_REV:?exact checkout SHA required}
        HUMANYMOUS_SOURCE_MANIFEST: ${HUMANYMOUS_SOURCE_MANIFEST:?frozen source manifest SHA256 required}
    network_mode: none
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
