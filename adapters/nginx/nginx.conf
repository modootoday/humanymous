load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
user root;
events {}
http {
    access_log off;
    js_import gate from /pilot/gate.js;
    client_max_body_size 64k;
    client_body_buffer_size 128k;
    client_body_in_single_buffer on;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    subrequest_output_buffer_size 64k;
    server {
        listen 8080;
        server_name example.test;
        location / { js_content gate.gate; }
        location = /_ipc {
            client_max_body_size 128k;
            internal;
            proxy_pass http://unix:/ipc/authority.sock:/adapter/v0.1/decision;
            proxy_pass_request_headers off;
            proxy_set_header Host localhost;
            proxy_set_header Content-Type application/json;
            proxy_set_header Authorization 'Bearer aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_send_timeout 1s;
            proxy_next_upstream off;
        }
        location @origin {
            proxy_pass http://fixture:9000;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host example.test;
            proxy_set_header Connection '';
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
            proxy_hide_header X-Accel-Redirect;
        }
    }
}
