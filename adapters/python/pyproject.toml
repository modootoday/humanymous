[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "humanymous-python-adapter"
version = "0.1.0a1"
description = "Experimental Rust native WSGI and ASGI authority bridge"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
readme = "README.md"
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
manifest-path = "../../crates/python-adapter/Cargo.toml"
module-name = "humanymous_python"
features = ["extension-module"]
bindings = "pyo3"

[tool.humanymous]
registry-name-status = "candidate-unverified"
qualified-tuples = []
free-threaded = false
abi3 = false
