# Project-scoped Codex config (loaded only when this project is trusted).
# Goal: Claude Code Auto-like behavior with a bounded workspace sandbox.
#
# Docs: approval_policy + sandbox_mode
#   https://learn.chatgpt.com/docs/config-file/config-reference
#   https://learn.chatgpt.com/docs/agent-approvals-security
#
# Codex's documented lower-risk local automation preset: routine edits and
# commands inside the workspace proceed automatically; network, external writes,
# and other sandbox escapes still request approval.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true
