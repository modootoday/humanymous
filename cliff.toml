# cliff.toml — git-cliff configuration (https://git-cliff.org).
#
# Generates CHANGELOG.md and per-release notes from this repo's Conventional
# Commits, in the Keep a Changelog format the project already uses. It is
# tag-driven (v* SemVer tags): `git cliff` maps commits since the previous tag
# into grouped sections. The maintainer stays in control of WHEN to release —
# git-cliff only writes the changelog for whatever tag you cut. See
# docs/how-to/cut-a-release.md.

[changelog]
# Matches the existing CHANGELOG.md preamble so a full regenerate stays consistent.
header = """
# Changelog

All notable changes to humanymous are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and this project adheres to
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). Security-relevant changes
are called out in a dedicated **Security** subsection with upgrade urgency.
"""

# One version block per release; commits grouped into Keep a Changelog sections,
# each linked to its commit when a GitHub remote is known.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif %}\
    {% if remote.github.owner and commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})){% endif %}\
{% endfor %}
{% endfor %}
"""

# Compare / tree links per release, only when the GitHub remote is resolvable
# (in CI, or when an origin remote is set). Local runs without a remote skip them.
footer = """
{% for release in releases -%}
    {% if remote.github.owner -%}
        {% if release.version and release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
        {% elif release.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""

trim = true

[git]
# Parse Conventional Commits and drop anything that is not one (merge commits,
# ad-hoc messages) from the changelog.
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

# Type → Keep a Changelog section. Order here is the section order in the output.
# Housekeeping types (test/ci/build/chore/style) are skipped — they are not
# user-facing changelog material. `harden` is this repo's security-hardening type.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^[Uu]pdate changelog", skip = true },
  { body = ".*security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^harden", group = "<!-- 0 -->Security" },
  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^chore", skip = true },
  { message = ".*", group = "<!-- 4 -->Changed" },
]

# A BREAKING CHANGE (feat!/fix!) is promoted regardless of its base type.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
