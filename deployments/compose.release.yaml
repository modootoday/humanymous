# humanymous runtime: adopter drop-in (SoT-31 R7). Pull-only: references
# published ghcr.io images, so `compose up` is a PULL, not a source build.
#
# The Rust runtime replaces the legacy Go Gate image. It is not a drop-in edge:
#   - It takes no arguments. One private JSON configuration document arrives on
#     standard input, so the runtime starts with `docker compose run -T ... <
#     runtime.json`, not `up` (compose cannot feed a file to a service's stdin).
#   - It listens and reaches the origin on loopback only. It joins the network
#     namespace of `edge`, YOUR TLS front proxy, which publishes :443, forwards
#     the inventoried routes to 127.0.0.1:8444 and makes the origin answer on
#     127.0.0.1:8080.
#   - No admin plane, no ACME/TLS, no health endpoint, no SIGTERM drain.
# See k8s/README.md for the full Go flag mapping and the gaps.
#
# Adopt:
#   1. cp .env.example .env   &&   edit .env   (edge image, origin network)
#   2. cp humanymous-runtime.example.json runtime.json && chmod 0600 runtime.json
#      && edit it (scope, routes, custody passphrase)
#   3. provision sealed custody on the hmn-data volume (no shipped Rust command
#      does this yet; see k8s/README.md "No Rust equivalent")
#   4. docker compose -f compose.release.yaml up -d edge
#   5. docker compose -f compose.release.yaml run --rm -T runtime < runtime.json
#
# This file ships NO build: and NO secrets; the lab stacks live in
# deployments/compose.yaml and deployments/lab/.
services:
  edge:
    # PLACEHOLDER: your TLS front proxy. It terminates TLS on 8443, forwards the
    # inventoried routes to the runtime at 127.0.0.1:8444, sends everything else
    # (health checks, static assets) straight to your origin, and makes the
    # origin reachable at 127.0.0.1:8080 in this network namespace (for example
    # by forwarding that loopback port to your app on origin-net).
    image: ${HMN_EDGE_IMAGE:?set HMN_EDGE_IMAGE to your TLS front proxy image}
    restart: unless-stopped
    ports:
      - "443:8443"                            # public edge on 443
    networks: [origin-net]

  runtime:
    image: ghcr.io/modootoday/humanymous-runtime:${HMN_VERSION:-latest}
    # No command: the entrypoint is /usr/local/bin/humanymous-runtime and it
    # refuses any argument. Configuration arrives on stdin; `run -T` keeps
    # stdout off a terminal, which the binary requires.
    stdin_open: true
    # Loopback-only listen/origin: share the edge's network namespace. No ports
    # are published for the runtime itself.
    network_mode: "service:edge"
    depends_on: [edge]
    user: "65532:65532"                       # the image's USER; configuration owner.uid
    # Container runtime hardening, unchanged from the Go Gate service. read_only
    # roots the filesystem: only the hmn-data volume and a /tmp tmpfs are
    # writable.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    # Kept from the Go service. The runtime installs no SIGTERM handler and
    # stops at once; audit appends are synced before a request reaches the
    # origin, so a stop loses in-flight requests, not committed records.
    stop_grace_period: 30s
    # No HEALTHCHECK: the image is FROM scratch (no shell) and the binary serves
    # no health path. Its readiness is one JSON line on standard output.
    volumes:
      - hmn-data:/var/lib/humanymous          # audit WAL (audit/) + sealed custody (keys/)

networks:
  # Join the adopter's existing origin network instead of a bundled demo.
  # Create it (`docker network create ${HMN_ORIGIN_NET}`) and attach your app, or
  # point HMN_ORIGIN_NET at the network your origin already runs on.
  origin-net:
    external: true
    name: ${HMN_ORIGIN_NET:-humanymous-origin}

volumes:
  # The Go file also had hmn-acme for Let's Encrypt certificates; the runtime
  # has no ACME, so certificates belong to the edge.
  hmn-data: {}
