# humanymous runtime: public edge Service.
#
# The runtime listens on loopback inside the pod, so this Service targets the
# `edge` container (your TLS front proxy) on 8443, not the runtime.
#
# The Go manifest also had a ClusterIP admin Service on 8445. The Rust runtime
# binary has no admin listener, so there is nothing to expose and that Service
# is gone. Do not add one for the runtime.
#
# LoadBalancer suits a from-scratch cluster. If you terminate TLS at an
# Ingress or an L7 load balancer instead, make this ClusterIP and point the
# Ingress at it.
apiVersion: v1
kind: Service
metadata:
  name: humanymous-runtime
  labels:
    app.kubernetes.io/name: humanymous-runtime
    app.kubernetes.io/component: edge
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: humanymous-runtime
  ports:
    - name: https
      port: 443              # public edge
      targetPort: edge       # the edge container's 8443
      protocol: TCP
