# humanymous runtime: Secret STUB.  DO NOT APPLY AS-IS.
#
# ============================================================================
# REPLACE THE PLACEHOLDERS BELOW WITH REAL VALUES BEFORE APPLYING.
# Better still, do NOT keep secrets in a manifest at all: generate them with a
# real secrets manager (External Secrets Operator, Sealed Secrets, Vault, your
# cloud's Secret Manager) and let it materialize this Secret. This file exists
# only to document the shape.
# ============================================================================
#
# The Go gate took HMN_UNSEAL and HMN_ADMIN_TOKENS as environment variables.
# The Rust runtime reads neither: it takes one JSON configuration document on
# standard input, and that document carries the custody unseal passphrase
# (audit.keys.passphrase). The runtime has no admin plane, so there are no
# admin tokens.
#
# This Secret is NOT mounted into the pod: the binary cannot read a file. You
# pipe runtime.json into the runtime container with `kubectl attach -i` (see
# README.md). The document below is identical to
# deployments/humanymous-runtime.example.json; a Rust test checks that and
# validates it with the runtime's own Configuration type.
apiVersion: v1
kind: Secret
metadata:
  name: humanymous-runtime-configuration
  labels:
    app.kubernetes.io/name: humanymous-runtime
type: Opaque
stringData:
  runtime.json: |
    {
      "listen": "127.0.0.1:8444",
      "origin": "127.0.0.1:8080",
      "scope": {
        "installation": "example-installation",
        "tenant": "example-tenant",
        "origin": "example-origin",
        "revision": "r1",
        "authority": "example.com"
      },
      "routes": [
        {
          "method": "POST",
          "path": "/login",
          "required": {
            "raw_tls": false,
            "original_h2": false,
            "raw_header_order": true,
            "collector": false,
            "rit": true
          }
        },
        {
          "method": "POST",
          "path": "/checkout",
          "required": {
            "raw_tls": false,
            "original_h2": false,
            "raw_header_order": true,
            "collector": false,
            "rit": true
          }
        },
        {
          "method": "GET",
          "path": "/account",
          "required": {
            "raw_tls": false,
            "original_h2": false,
            "raw_header_order": true,
            "collector": false,
            "rit": true
          }
        },
        {
          "method": "POST",
          "path": "/api",
          "required": {
            "raw_tls": false,
            "original_h2": false,
            "raw_header_order": true,
            "collector": false,
            "rit": true
          }
        }
      ],
      "audit": {
        "directory": "/var/lib/humanymous/audit",
        "node_id": "humanymous-runtime-1",
        "keys": {
          "directory": "/var/lib/humanymous/keys",
          "passphrase": "REPLACE-ME-with-the-custody-unseal-passphrase"
        },
        "allow_new": true,
        "trusted_head": null,
        "require_external_witness": false
      },
      "owner": {
        "kind": "unix",
        "uid": 65532
      },
      "session_capacity": 1024,
      "session_ttl_ms": 600000,
      "timeout_ms": 25000,
      "rate_per_second": 1000,
      "session_rate_per_second": 100
    }
