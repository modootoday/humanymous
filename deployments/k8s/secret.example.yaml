# humanymous Gate — Secret STUB.  ⚠️  DO NOT APPLY AS-IS. ⚠️
#
# ============================================================================
# REPLACE THE PLACEHOLDERS BELOW WITH REAL, RANDOM VALUES BEFORE APPLYING.
# Better still, do NOT keep secrets in a manifest at all: generate them with a
# real secrets manager (External Secrets Operator, Sealed Secrets, Vault, your
# cloud's Secret Manager) and let it materialize this Secret. This file exists
# only to document the shape and the two required keys.
# ============================================================================
#
# The binary REFUSES to boot on the shipped e2e-* dev tokens, so real values are
# mandatory — a placeholder deploy will crash-loop until you set them.
apiVersion: v1
kind: Secret
metadata:
  name: humanymous-gate-secrets
  labels:
    app.kubernetes.io/name: humanymous-gate
type: Opaque
stringData:
  # Passphrase that seals the persistent audit/keystore identity across restarts
  # (so a reboot does not crypto-shred pseudonym linkage). Keep it secret; losing
  # it orphans the existing keystore on the hmn-data PVC.
  HMN_UNSEAL: "REPLACE-ME-with-a-long-random-passphrase"

  # Admin bearer tokens as role:token pairs, comma-separated. Generate real
  # random tokens (e.g. `openssl rand -hex 32` per role). The binary rejects the
  # e2e-* dev tokens. Do NOT set HMN_ALLOW_DEV_TOKENS in production.
  HMN_ADMIN_TOKENS: "auditor:REPLACE-ME,operator:REPLACE-ME,approver:REPLACE-ME,dpo:REPLACE-ME"
