# humanymous runtime: Kubernetes Deployment.
#
# Runs the Rust `humanymous-runtime` image in place of the legacy Go `gate`
# image. Hardening is unchanged: non-root uid 65532, read-only rootfs, no
# capabilities, seccomp RuntimeDefault, durable audit storage on a PVC.
#
# What changed with the Rust runtime (details in README.md):
#   - No argv. The binary refuses arguments and reads one private JSON
#     configuration document on standard input. This pod keeps stdin open once
#     (stdinOnce) and you feed the document with `kubectl attach -i` after each
#     container start. Until then the container waits and serves nothing.
#   - Loopback only. `listen` and `origin` must be loopback addresses, so the
#     origin and the public TLS edge share this pod's network namespace. The
#     `edge` container is a placeholder for YOUR TLS front proxy.
#   - No admin plane, no ACME/TLS, no HTTP health endpoint, no SIGTERM drain.
#
# Apply order (see README.md in this directory):
#   kubectl apply -f pvc.yaml
#   kubectl apply -f secret.example.yaml   # AFTER you replace the placeholders!
#   kubectl apply -f deployment.yaml -f service.yaml
#   then feed the configuration with `kubectl attach -i` (README.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanymous-runtime
  labels:
    app.kubernetes.io/name: humanymous-runtime
    app.kubernetes.io/component: edge
spec:
  # Sealed custody takes an exclusive lock and the PVC is ReadWriteOnce, so two
  # pods can never share it. Recreate stops the old pod before the new one
  # starts; a surge pod would only block on the volume or the custody lock.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: humanymous-runtime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: humanymous-runtime
        app.kubernetes.io/component: edge
    spec:
      # Kept from the Go manifest for the edge proxy's own drain. The runtime
      # binary installs no SIGTERM handler and stops immediately.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Pod-level hardening (defence in depth with the container securityContext).
      # No fsGroup: the runtime refuses audit and custody directories that a
      # group can read or write, and fsGroup would make them group-accessible.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the image's USER and the configuration's owner.uid
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          # :latest tracks the newest release; pin a semver tag in production.
          # The image is a candidate component (label
          # org.humanymous.qualification=candidate-component), not a
          # qualified product release.
          image: ghcr.io/modootoday/humanymous-runtime:latest
          imagePullPolicy: Always
          # No command or args: the entrypoint is /usr/local/bin/humanymous-runtime
          # and it refuses any argument. Configuration arrives on stdin.
          stdin: true
          stdinOnce: true
          tty: false                # the binary refuses a terminal on stdin or stdout
          # No ports: the runtime binds 127.0.0.1:8444 (`listen`), reachable only
          # from containers in this pod. No probes: the image has no shell, the
          # listener is not on the pod IP, and the binary serves no health path.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # only the mounts below are writable
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp               # scratch on read-only rootfs
            - name: data
              mountPath: /var/lib/humanymous  # audit WAL + sealed custody (persistent)
        # PLACEHOLDER: your TLS front proxy. It terminates TLS on :8443, forwards
        # the inventoried routes to the runtime at 127.0.0.1:8444, and serves or
        # forwards everything else (health checks, static assets) straight to the
        # origin. The origin must answer on 127.0.0.1:8080 inside this pod: run
        # your app as another container here, or let this proxy forward that
        # loopback port to your app's Service. The runtime ships none of this.
        - name: edge
          image: registry.example.invalid/your-tls-edge:REPLACE-ME
          ports:
            - name: edge
              containerPort: 8443
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}                      # ephemeral /tmp for the read-only rootfs
        - name: data
          persistentVolumeClaim:
            claimName: hmn-data
