# humanymous Gate — Kubernetes Deployment.
#
# Mirrors deployments/compose.release.yaml: the published, distroless, non-root
# (uid 65532), read-only-rootfs Gate image, fronting YOUR origin with ACME TLS,
# a sealed keystore, and a durable audit WAL.
#
# Apply order (see README.md in this directory):
#   kubectl apply -f pvc.yaml -f configmap-routes.yaml
#   kubectl apply -f secret.example.yaml   # AFTER you replace the placeholders!
#   kubectl apply -f deployment.yaml -f service.yaml
#
# The admin plane (:8445) is NOT exposed by service.yaml. Keep it cluster-internal
# and front it with mTLS/SSO — see the admin-plane caveat in README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanymous-gate
  labels:
    app.kubernetes.io/name: humanymous-gate
    app.kubernetes.io/component: edge
spec:
  # ACME (TLS-ALPN-01) issues one cert per domain and stores it on the shared
  # hmn-acme PVC. Running >1 replica against a single RWO PVC will not work; to
  # scale out, use an RWX volume (or terminate TLS upstream and drop -acme-domain)
  # and give each pod its own keystore identity. Start at 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: humanymous-gate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: humanymous-gate
        app.kubernetes.io/component: edge
    spec:
      # >= gate -shutdown-grace (default 25s) so the in-process drain completes
      # before the kubelet SIGKILLs the pod. Keep this >= the flag.
      terminationGracePeriodSeconds: 30
      # Pod-level hardening (defence in depth with the container securityContext).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the image's baked-in nonroot uid (distroless)
        runAsGroup: 65532
        fsGroup: 65532            # so the mounted PVCs are writable by uid 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          # :latest tracks the newest release; pin a semver tag in production.
          image: ghcr.io/modootoday/humanymous-gate:latest
          imagePullPolicy: Always
          args:
            - "-addr"
            - ":8444"               # public edge listener (Service maps 443 -> 8444)
            - "-admin-addr"
            - ":8445"               # admin console — NOT exposed by the Service
            - "-upstream"
            - "http://origin:80"    # CHANGE ME: your origin Service, e.g. http://app.default.svc:8080
            - "-acme-domain"
            - "example.com"         # CHANGE ME: the public domain Gate serves (real TLS via ACME).
                                    # For BYO TLS instead, drop -acme-domain and add -tls-cert/-tls-key.
            - "-acme-cache"
            - "/acme-cache"         # persist issued certs on the hmn-acme PVC. MUST be an absolute
                                    # path onto a writable volume — the default is relative and lands
                                    # on the read-only rootfs, so ACME would fail (or re-issue every
                                    # restart and hit the Let's Encrypt rate limit).
            - "-routes"
            - "/etc/hmn/routes.conf" # mounted from the routes ConfigMap
            - "-keystore"
            - "/data/keystore"      # persistent audit identity (needs HMN_UNSEAL below)
            - "-audit-wal"
            - "/data/audit"         # durable, replay-verified audit log (SoT-32)
            # -shutdown-grace defaults to 25s (< terminationGracePeriodSeconds above); no flag needed.
          ports:
            - name: edge
              containerPort: 8444
              protocol: TCP
            - name: admin
              containerPort: 8445
              protocol: TCP
          envFrom:
            - secretRef:
                name: humanymous-gate-secrets   # HMN_UNSEAL + HMN_ADMIN_TOKENS (see secret.example.yaml)
          # Liveness/readiness are HTTPS probes on the edge listener. The image is
          # distroless (no shell), so exec probes are impossible — use httpGet.
          # The edge speaks TLS, so scheme: HTTPS; the kubelet does not verify the
          # cert, so a self-signed/ACME cert is fine for probes.
          livenessProbe:
            httpGet:
              path: /__hmn/healthz  # always-on, unauthenticated liveness
              port: 8444
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /__hmn/readyz   # 503s during drain so the endpoint is pulled first
              port: 8444
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # A preStop LB-deregistration de-race is DISABLED by default: the published image is
          # distroless and ships NO /bin/sleep, so an exec hook would fail (FailedPreStopHook).
          # Graceful shutdown is already covered by the readinessProbe (readyz -> 503 on drain,
          # so the endpoint is pulled before the drain) + the in-process SIGTERM drain bounded
          # by -shutdown-grace. Only if YOUR image bundles a shell/sleep, re-enable:
          #   lifecycle:
          #     preStop:
          #       exec:
          #         command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # only the mounts below are writable
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp             # scratch on read-only rootfs
            - name: data
              mountPath: /data            # keystore + audit WAL (persistent)
            - name: acme
              mountPath: /acme-cache      # issued TLS certs (persistent)
            - name: routes
              mountPath: /etc/hmn         # routes.conf from the ConfigMap
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}                    # ephemeral /tmp for the read-only rootfs
        - name: data
          persistentVolumeClaim:
            claimName: hmn-data
        - name: acme
          persistentVolumeClaim:
            claimName: hmn-acme
        - name: routes
          configMap:
            name: humanymous-gate-routes  # provides routes.conf
