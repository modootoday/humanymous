# humanymous runtime: persistent volume.
#
# One claim, mounted at /var/lib/humanymous:
#   audit/  the durable audit WAL         (configuration audit.directory)
#   keys/   the sealed audit custody      (configuration audit.keys.directory)
#
# The Go manifest also had hmn-acme for Let's Encrypt certificates. The Rust
# runtime has no ACME or TLS listener, so that claim is gone; certificates
# belong to your TLS front proxy.
#
# The runtime refuses audit/ and keys/ unless they are owned by uid 65532 with
# mode 0700, and refuses any ancestor directory that another unprivileged user
# owns or that is group- or world-writable. Check what your StorageClass
# provisions for the volume root before the first start.
#
# ReadWriteOnce, which is why the Deployment runs one replica. storageClassName
# is omitted so your cluster's default StorageClass is used. The WAL grows with
# audit volume; raise the size if you retain a long history.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hmn-data
  labels:
    app.kubernetes.io/name: humanymous-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
