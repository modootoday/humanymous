# Actual available local authority + Node adapter, not a full Gate profile.
services:
  authority-pilot:
    extends: {file: topology/sandbox.yaml, service: sandbox}
    image: humanymous/authority-lab:${HM_LAB_IMAGE_TAG:-local}
    build:
      context: ${HM_LAB_BUILD_CONTEXT:-../..}
      dockerfile: build/rust/authority-lab.Dockerfile
    network_mode: none
    pids_limit: 128
    mem_limit: 384m
    cpus: 1
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    labels:
      org.humanymous.evidence: rust-authority-node-ipc
    profiles: [authority]
