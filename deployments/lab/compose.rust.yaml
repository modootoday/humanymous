# Canonical Rust-only controls plus the actual bounded runtime process pilot.
x-build: &rust-build
  context: ${HM_LAB_BUILD_CONTEXT:?Rust runner must supply immutable source}
  dockerfile: deployments/lab/images/product.Dockerfile
x-rust-control: &rust-control
  extends: {file: topology/sandbox.yaml, service: sandbox}
  image: humanymous/lab-controls:${HM_LAB_IMAGE_TAG:?Rust runner must supply an owned image tag}
  build:
    <<: *rust-build
    target: controls
services:
  origin:
    <<: *rust-control
    command: [fixture, serve, origin]
    networks: [backend]
    healthcheck:
      test: [CMD, /usr/local/bin/humanymous-lab-runner, fixture, health]
      interval: 2s
      timeout: 3s
      retries: 15
  outside-canary:
    <<: *rust-control
    command: [fixture, serve, outside-canary]
    networks: [outside]
    healthcheck:
      test: [CMD, /usr/local/bin/humanymous-lab-runner, fixture, health]
      interval: 2s
      timeout: 3s
      retries: 15
  attacker:
    <<: *rust-control
    command: [fixture, probe]
    networks: [ingress]
    profiles: [controls]
  backend-control:
    <<: *rust-control
    command: [fixture, control]
    networks: [backend]
    profiles: [controls]
  runtime-pilot:
    <<: *rust-control
    image: humanymous/product-lab:${HM_LAB_IMAGE_TAG:?Rust runner must supply owned tag}
    build:
      <<: *rust-build
      target: runtime
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot]
    network_mode: none
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: !override ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
networks:
  ingress: &internal
    internal: true
    enable_ipv6: false
    labels:
      org.humanymous.owner: rust-product-lab
      org.humanymous.expires: "${HM_LAB_EXPIRES:?Rust runner must supply expiry}"
  backend: *internal
  outside: *internal
