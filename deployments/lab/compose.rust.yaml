# Canonical Rust-only controls plus the actual bounded runtime process pilot.
x-build: &rust-build
  context: ${HM_LAB_BUILD_CONTEXT:?Rust runner must supply immutable source}
  dockerfile: deployments/lab/images/product.Dockerfile
x-rust-control: &rust-control
  extends: {file: topology/sandbox.yaml, service: sandbox}
  image: humanymous/lab-controls:${HM_LAB_IMAGE_TAG:?Rust runner must supply an owned image tag}
  build:
    <<: *rust-build
    target: controls
# Runtime-image actors for the origin/audit binding stage.
x-origin-audit: &origin-audit
  <<: *rust-control
  image: humanymous/product-lab:${HM_LAB_IMAGE_TAG:?Rust runner must supply owned tag}
  build:
    <<: *rust-build
    target: runtime
services:
  origin:
    <<: *rust-control
    command: [fixture, serve, origin]
    networks: [backend]
    healthcheck:
      test: [CMD, /usr/local/bin/humanymous-lab-runner, fixture, health]
      interval: 2s
      timeout: 3s
      retries: 15
  outside-canary:
    <<: *rust-control
    command: [fixture, serve, outside-canary]
    networks: [outside]
    healthcheck:
      test: [CMD, /usr/local/bin/humanymous-lab-runner, fixture, health]
      interval: 2s
      timeout: 3s
      retries: 15
  attacker:
    <<: *rust-control
    command: [fixture, probe]
    networks: [ingress]
    profiles: [controls]
  backend-control:
    <<: *rust-control
    command: [fixture, control]
    networks: [backend]
    profiles: [controls]
  runtime-pilot:
    <<: *rust-control
    image: humanymous/product-lab:${HM_LAB_IMAGE_TAG:?Rust runner must supply owned tag}
    build:
      <<: *rust-build
      target: runtime
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot]
    network_mode: none
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: !override ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  wargame-pilot:
    extends: {service: runtime-pilot}
    command: [--wargame]
  attestation-pilot:
    extends: {service: runtime-pilot}
    command: [--attestation]
  pass-pilot:
    extends: {service: runtime-pilot}
    command: [--pass]
  # Roadmap 2c: cross-namespace origin/audit binding (Go parity: origin on its
  # own network, Gate on both, client on the attack network only). The Gate's
  # sealed custody and WAL are named volumes so they survive a restart; the
  # tamper actor mounts the WAL only and has no network.
  oa-origin:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-origin]
    networks: [backend]
  oa-gate:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-gate]
    stdin_open: true
    networks: [ingress, backend]
    volumes: [oa-keys:/writer/keys, oa-wal:/writer/wal]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: !override ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  oa-client:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-client]
    stdin_open: true
    networks: [ingress]
  oa-tamper:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-tamper]
    stdin_open: true
    network_mode: none
    volumes: [oa-wal:/writer/wal]
  # Roadmap 2: the Rust attacker network catalog across the same internal
  # bridges (Go parity: bots.yaml runs the catalog from a lab-network-only
  # container against the Gate). The Gate keeps custody and WAL on its private
  # tmpfs for the stage; the runner starts one runtime session per case.
  ac-origin:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-origin]
    networks: [backend]
  ac-gate:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --attack-gate]
    stdin_open: true
    networks: [ingress, backend]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: !override ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  ac-attacker:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --attack-client]
    stdin_open: true
    networks: [ingress]
  # Roadmap 4 item 2a: full Gate TLS/H2/capture. The shipped runtime terminates
  # TLS itself from the closed launch envelope with a pair the Gate generates
  # from an ephemeral lab CA on its private tmpfs (never committed, no
  # self-signed fallback); the ingress relay is L4 passthrough so the runtime
  # captures the original client's ClientHello, H1 order and H2 frames.
  tg-origin:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --origin-audit-origin]
    networks: [backend]
  tg-gate:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --gate-tls]
    stdin_open: true
    networks: [ingress, backend]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: !override ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  tg-client:
    <<: *origin-audit
    entrypoint: [/usr/local/bin/humanymous-runtime-pilot, --gate-tls-client]
    stdin_open: true
    networks: [ingress]
networks:
  ingress: &internal
    internal: true
    enable_ipv6: false
    labels:
      org.humanymous.owner: rust-product-lab
      org.humanymous.expires: "${HM_LAB_EXPIRES:?Rust runner must supply expiry}"
  backend: *internal
  outside: *internal
volumes:
  oa-keys: &owned-volume
    labels:
      org.humanymous.owner: rust-product-lab
      org.humanymous.expires: "${HM_LAB_EXPIRES:?Rust runner must supply expiry}"
  oa-wal: *owned-volume
