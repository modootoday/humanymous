# G5 witness-transport Cap topology (Cap=0 Cap-ready; Cap=1 after Cap realloc).
# Distinct from custody/witness component honesty and compose.rust.witness.yaml product path.
# Detection freeze. Lab-only; no published ports. network_mode=none loopback measure.
# Never invent pass_product_clean_room / Cap free / authenticated_witness_transport.
services:
  g5-witness-transport-pilot:
    extends: {file: topology/sandbox.yaml, service: sandbox}
    image: humanymous/g5-witness-transport-lab:${HM_LAB_IMAGE_TAG:-local}
    build:
      context: ${HM_LAB_BUILD_CONTEXT:-../..}
      dockerfile: build/rust/g5-witness-transport-lab.Dockerfile
    network_mode: none
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    labels:
      org.humanymous.evidence: rust-g5-witness-transport
    profiles: [g5-witness-transport]
