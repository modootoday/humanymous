# G6 origin-audit-binding Cap topology (Cap=0 Cap-ready; Cap=1 after Cap realloc).
# Distinct from spent G2/G5/CR Cap twins. Detection freeze. Lab-only; no published ports.
# network_mode=none loopback measure. Never invent pass_product_clean_room / Cap free / origin_audit_product_binding.
services:
  g6-origin-audit-binding-pilot:
    extends: {file: topology/sandbox.yaml, service: sandbox}
    image: humanymous/g6-origin-audit-binding-lab:${HM_LAB_IMAGE_TAG:-local}
    build:
      context: ${HM_LAB_BUILD_CONTEXT:-../..}
      dockerfile: build/rust/g6-origin-audit-binding-lab.Dockerfile
    network_mode: none
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    labels:
      org.humanymous.evidence: rust-g6-origin-audit-binding
    profiles: [g6-origin-audit-binding]
