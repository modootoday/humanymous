<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout — Demo Origin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1.2rem; color: #1c2733; }
  .row { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid #eef2f6; }
  button { margin-top: 1.2rem; padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #16a34a; color: #fff; font-weight: 600; cursor: pointer; }
  p.note { color: #667; }
</style>
</head>
<body>
  <h1>Checkout</h1>
  <p class="note">A <b>strict</b> route: carding / inventory-scalping automation is denied at the edge.</p>
  <div class="row"><span>Widget × 1</span><span>$19.00</span></div>
  <div class="row"><span>Shipping</span><span>$4.00</span></div>
  <div class="row"><b>Total</b><b>$23.00</b></div>
  <button type="submit">Pay now</button>
</body>
</html>
