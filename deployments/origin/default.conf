# Origin app served by nginx. The sentinel proxies to http://origin:80 and
# injects the detection bundle into these HTML responses on the fly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sentinel marks /health as "off" (never scored); origin answers cheaply.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serve the storefront; fall back to the section's index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
