# Origin app served by nginx. The gate proxies to http://origin:80 and
# injects the detection bundle into these HTML responses on the fly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gate marks /health as "off" (never scored); origin answers cheaply.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # PLAN-08 R4 — echo the client IP the gate forwarded (its authoritative
    # X-Forwarded-For == the RemoteAddr it saw). Behind an L4 passthrough with PROXY
    # protocol, this is the REAL client, not the balancer. Harmless to other tests.
    location = /whoami {
        default_type text/plain;
        return 200 "$http_x_forwarded_for\n";
    }

    # Serve the storefront; fall back to the section's index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
