# PLAN-08 R4 — L4/TCP passthrough in front of the gate. mode tcp means HAProxy does
# NOT terminate TLS (the gate keeps the real ClientHello for JA3/JA4); send-proxy-v2
# prepends a PROXY protocol v2 header so the gate can recover the true client IP.
global
    log stdout format raw local0
defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend edge
    bind :8460
    default_backend gate
backend gate
    server g gate:8444 send-proxy-v2
