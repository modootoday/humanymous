# PLAN-08 backlog — ClickHouse audit projection with CREDENTIALS. ClickHouse requires a
# password; the gate authenticates via HTTP Basic Auth (kept out of the URL).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "chpass"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123"
    networks: [web]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
  gate:
    command: ["-addr", ":8444", "-admin-addr", ":8445", "-upstream", "http://origin:80", "-node", "gate-1", "-audit-clickhouse", "http://clickhouse:8123"]
    environment:
      HMN_ADMIN_TOKENS: "auditor:e2e-auditor-token,operator:e2e-operator-token,approver:e2e-approver-token,dpo:e2e-dpo-token"
      HMN_ALLOW_DEV_TOKENS: "1"
      HMN_CLICKHOUSE_USER: "default"
      HMN_CLICKHOUSE_PASSWORD: "chpass"   # gate -> ClickHouse via HTTP Basic Auth
    depends_on: [origin, clickhouse]
