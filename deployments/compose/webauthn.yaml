# PLAN-08 R2 — WebAuthn possession-assertion verification proof. The gate trust-upgrades
# a request carrying a valid, fresh assertion from a registered credential.
#
#   go run ./scripts/gen-demo-keys        # mint the demo credential keypair (not committed)
#   docker compose -f deployments/compose.yaml -f deployments/compose/webauthn.yaml up -d origin gate
#   node scripts/assert-webauthn.mjs
services:
  gate:
    command:
      - "-addr"
      - ":8444"
      - "-admin-addr"
      - ":8445"
      - "-upstream"
      - "http://origin:80"
      - "-node"
      - "gate-1"
      - "-webauthn-creds"
      - "/app/webauthncreds/creds.txt"
    environment:
      HMN_ADMIN_TOKENS: "auditor:e2e-auditor-token,operator:e2e-operator-token,approver:e2e-approver-token,dpo:e2e-dpo-token"
      HMN_ALLOW_DEV_TOKENS: "1"
      HMN_WEBAUTHN_ORIGIN: "https://example.com"   # PLAN-08 backlog: bind assertions to this origin
    volumes:
      - ./webauthncreds:/app/webauthncreds:ro
    depends_on: [origin]
