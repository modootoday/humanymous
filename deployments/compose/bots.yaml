# Bots — the automation catalog (SRP: the offense). On-demand, NETWORK-SANDBOXED:
# every bots container attaches to ONLY an internal lab network, so it can reach
# nothing but the detector. Readiness is polled in-script, so no cross-fragment
# depends_on.
x-bots-image: &bots-image "humanymous/bots:local"
x-bots-build: &bots-build
  context: ../../
  dockerfile: build/bots.Dockerfile
x-swarm: &swarm
  image: *bots-image
  build: *bots-build
  entrypoint: ["/app/run-swarm.sh"]
  env_file: [../../configs/dev.env]
  volumes: [../artifacts:/artifacts]
  profiles: [swarm]

services:
  # The full automation catalog vs the core engine (47-profile catalog: 45 bots + baseline + ceiling).
  bots:
    image: *bots-image
    build: *bots-build
    env_file: [../../configs/dev.env]
    volumes: [../artifacts:/artifacts]
    networks: [lab-a]
    profiles: [attack]

  attack-assert:
    image: *bots-image
    build: *bots-build
    entrypoint: ["node", "/app/scripts/assert-attack.mjs", "/artifacts/core-results.json"]
    volumes: [../artifacts:/artifacts:ro]
    networks: [lab-a]
    profiles: [attack]

  # Self-contained Gate proxy-layer conformance.
  gate-e2e:
    image: *bots-image
    build: *bots-build
    entrypoint: ["/app/run-gate-e2e.sh"]
    volumes: [../artifacts:/artifacts]
    networks: [lab-a]
    profiles: [gate-test]

  pass-e2e:
    image: *bots-image
    build: *bots-build
    entrypoint: ["node", "/app/test/redteam/pass_e2e.mjs"]
    env_file: [../../configs/dev.env]
    environment:
      HM_BASE: "https://core:8443"
    networks: [lab-a]
    profiles: [pass-test]

  pass-wargame:
    image: *bots-image
    build: *bots-build
    entrypoint: ["node", "/app/test/redteam/pass_wargame.mjs"]
    env_file: [../../configs/dev.env]
    environment:
      HM_BASE: "https://core:8443"
    networks: [lab-a]
    profiles: [pass-test]

  # Multi-subnet swarm: the SAME fingerprint from THREE real subnets, to exercise
  # cross-session correlation (proxy_rotation / shared_fingerprint) for real.
  bot-swarm-a:
    <<: *swarm
    networks: [lab-a]
  bot-swarm-b:
    <<: *swarm
    networks: [lab-b]
  bot-swarm-c:
    <<: *swarm
    networks: [lab-c]

  swarm-reset:
    image: *bots-image
    build: *bots-build
    entrypoint: ["sh", "-c", "rm -f /artifacts/swarm-correlation.ok"]
    volumes: [../artifacts:/artifacts]
    networks: [lab-a]
    profiles: [swarm]

  swarm-assert:
    image: *bots-image
    build: *bots-build
    entrypoint: ["sh", "-c", "test -s /artifacts/swarm-correlation.ok || { echo 'FAIL: proxy_rotation never fired across subnets' >&2; exit 1; }"]
    volumes: [../artifacts:/artifacts:ro]
    networks: [lab-a]
    profiles: [swarm]
