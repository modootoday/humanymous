# PLAN-08 R2 — Privacy Pass PAT verification proof. The gate trust-upgrades a request
# carrying a valid RFC 9578 Private Access Token from a trusted issuer.
#
#   docker compose -f deployments/compose.yaml -f deployments/compose/privacypass.yaml \
#       up -d origin gate
#   node scripts/assert-privacypass.mjs
#
# issuer.pem is a DEMO issuer public key (issuer-priv.pem, its private half, mints the
# test token) — NOT a real Privacy Pass issuer.
services:
  gate:
    command:
      - "-addr"
      - ":8444"
      - "-admin-addr"
      - ":8445"
      - "-upstream"
      - "http://origin:80"
      - "-node"
      - "gate-1"
      - "-pat-issuers"
      - "/app/patissuers/issuer.pem"
    environment:
      HMN_ADMIN_TOKENS: "auditor:e2e-auditor-token,operator:e2e-operator-token,approver:e2e-approver-token,dpo:e2e-dpo-token"
      HMN_ALLOW_DEV_TOKENS: "1"
    volumes:
      - ./patissuers:/app/patissuers:ro
    depends_on: [origin]
