# PLAN-08 R3 — Web Bot Auth verification proof.
#
# The gate verifies RFC 9421 request signatures against an operator allowlist: a valid
# signature from a listed key is a trust-upgrade, a forgery of a listed key is denied.
#
#   docker compose -f deployments/compose.yaml -f deployments/compose/webbotauth.yaml \
#       up -d origin gate
#   node scripts/assert-webbotauth.mjs
#
# Paths are relative to the project dir (deployments/, the first -f's directory).
services:
  gate:
    command:
      - "-addr"
      - ":8444"
      - "-admin-addr"
      - ":8445"
      - "-upstream"
      - "http://origin:80"
      - "-node"
      - "gate-1"
      - "-agent-keys"
      - "/app/agentkeys/trusted.txt"
    environment:
      HMN_ADMIN_TOKENS: "auditor:e2e-auditor-token,operator:e2e-operator-token,approver:e2e-approver-token,dpo:e2e-dpo-token"
      HMN_ALLOW_DEV_TOKENS: "1"
    volumes:
      - ./agentkeys:/app/agentkeys:ro
    depends_on: [origin]
