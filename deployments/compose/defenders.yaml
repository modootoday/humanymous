# Defenders — the detection stack (SRP). Long-running, host-visible. Reachable
# from every lab subnet so any bots container can attack them.
services:
  core:
    build:
      context: ../../
      dockerfile: build/core.Dockerfile
    image: humanymous/core:local
    # The public image ENTRYPOINT targets :443 + ACME; for the local run we
    # override to self-signed TLS on :8443.
    entrypoint: ["/app/server"]
    command: ["-addr", ":8443", "-web", "/app/web"]
    env_file:
      - ../../configs/dev.env
    ports:
      - "8443:8443"
    networks: [web, lab-a, lab-b, lab-c]

  origin:
    image: nginx:alpine
    volumes:
      - ../origin/html:/usr/share/nginx/html:ro
      - ../origin/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

  gate:
    build:
      context: ../../
      dockerfile: build/gate.Dockerfile
    image: humanymous/gate:local
    command:
      - "-addr"
      - ":8444"
      - "-admin-addr"
      - ":8445"
      - "-upstream"
      - "http://origin:80"
      - "-node"
      - "gate-1"
      - "-settings-dir"
      - "/var/lib/humanymous/settings"
    env_file:
      - ../../configs/dev.env
    volumes:
      - gate-settings:/var/lib/humanymous/settings
    ports:
      - "8444:8444"
      - "8445:8445"
    depends_on: [origin]
    networks: [web, lab-a, lab-b, lab-c]

volumes:
  gate-settings:
