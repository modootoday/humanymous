name: CI / Cross OS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cross-os-probe.yml
      - scripts/ci/runner-probe/**
      - scripts/ci/delivery/**
      - scripts/ci/windows-native-runner/**
      - scripts/ci/cef-pilot/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
permissions:
  contents: read
concurrency:
  group: cross-os-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: windows, arch: x64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
          - {runner: macos-15-intel, os: macos, arch: x64}
          - {runner: macos-15, os: macos, arch: arm64}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Configure native Windows CEF build tools
        if: runner.os == 'Windows'
        run: cargo run --manifest-path scripts/ci/cef-pilot/Cargo.toml --locked -- --configure-toolchain
      - name: Observe native tuple and execute implemented workspace tests
        run: cargo run --locked -p humanymous-delivery -- probe ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.CI_COMPONENT_ARTIFACTS == 'true'
        with:
          name: probe-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: target/runner-probe/
          if-no-files-found: error
          retention-days: 1
