# Canon: .spec/sot/delivery.sot.md; reproduce with scripts/ci/render_workflows.py
name: release
'on':
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/rust-validation.yml
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - run: python3 scripts/ci/delivery.py release
    - run: python3 scripts/ci/delivery.py crate-waves
      id: waves
    needs: validate
    outputs:
      count: ${{ steps.waves.outputs.count }}
  images:
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: core
          dockerfile: build/core.Dockerfile
        - name: gate
          dockerfile: build/gate.Dockerfile
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name }}
        flavor: 'latest=true

          '
        tags: 'type=semver,pattern={{version}}

          type=semver,pattern={{major}}.{{minor}}

          type=semver,pattern={{major}}

          type=sha,format=long

          '
    - id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        build-args: 'VERSION=${{ steps.meta.outputs.version }}

          '
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: mode=max
        sbom: true
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
    - name: Sign the pushed image
      run: "cosign sign --yes \\\n  ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name\
        \ }}@${{ steps.build.outputs.digest }}\n"
    - name: Export digest for gate job
      run: "mkdir -p \"${{ runner.temp }}/digests\"\n# build-push outputs digest like sha256:\u2026\n\
        echo -n \"${{ steps.build.outputs.digest }}\" > \"${{ runner.temp }}/digests/${{ matrix.name }}\"\
        \n"
    - name: Upload digest artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: digest-${{ matrix.name }}
        path: ${{ runner.temp }}/digests/${{ matrix.name }}
        if-no-files-found: error
        retention-days: 5
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: release
  images-ok:
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 10
    steps:
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download digests
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: digests
        pattern: digest-*
        merge-multiple: true
    - name: Assert core + gate digests present
      env:
        OWNER: ${{ github.repository_owner }}
        TAG: ${{ github.ref_name }}
      run: "set -euo pipefail\ntest -s digests/core\ntest -s digests/gate\nCORE_DIGEST=$(cat digests/core)\n\
        GATE_DIGEST=$(cat digests/gate)\necho \"core digest=$CORE_DIGEST\"\necho \"gate digest=$GATE_DIGEST\"\
        \n# Strip leading v for docker semver tags (v0.2.0 \u2192 0.2.0)\nVER=\"${TAG#v}\"\ndocker buildx\
        \ imagetools inspect \"ghcr.io/${OWNER}/humanymous-core:${VER}\"\ndocker buildx imagetools inspect\
        \ \"ghcr.io/${OWNER}/humanymous-gate:${VER}\"\ndocker buildx imagetools inspect \"ghcr.io/${OWNER}/humanymous-core:latest\"\
        \ndocker buildx imagetools inspect \"ghcr.io/${OWNER}/humanymous-gate:latest\"\n"
    permissions:
      contents: read
      packages: read
  gh-release:
    runs-on: ubuntu-latest
    needs:
    - images
    - images-ok
    - crates
    - npm
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: native-binaries-*
        path: release-assets
        merge-multiple: true
    - name: Generate release notes (git-cliff)
      id: notes
      uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: RELEASE_NOTES.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create GitHub release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        body: ${{ steps.notes.outputs.content }}
        files: release-assets/*
        fail_on_unmatched_files: true
    environment: release
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth0
      if: ${{ fromJSON(needs.readiness.outputs.count) > 0 }}
    - run: python3 scripts/ci/delivery.py publish-wave 0
      if: ${{ fromJSON(needs.readiness.outputs.count) > 0 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth0.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth1
      if: ${{ fromJSON(needs.readiness.outputs.count) > 1 }}
    - run: python3 scripts/ci/delivery.py publish-wave 1
      if: ${{ fromJSON(needs.readiness.outputs.count) > 1 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth2
      if: ${{ fromJSON(needs.readiness.outputs.count) > 2 }}
    - run: python3 scripts/ci/delivery.py publish-wave 2
      if: ${{ fromJSON(needs.readiness.outputs.count) > 2 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth3
      if: ${{ fromJSON(needs.readiness.outputs.count) > 3 }}
    - run: python3 scripts/ci/delivery.py publish-wave 3
      if: ${{ fromJSON(needs.readiness.outputs.count) > 3 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth4
      if: ${{ fromJSON(needs.readiness.outputs.count) > 4 }}
    - run: python3 scripts/ci/delivery.py publish-wave 4
      if: ${{ fromJSON(needs.readiness.outputs.count) > 4 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth4.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth5
      if: ${{ fromJSON(needs.readiness.outputs.count) > 5 }}
    - run: python3 scripts/ci/delivery.py publish-wave 5
      if: ${{ fromJSON(needs.readiness.outputs.count) > 5 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth5.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth6
      if: ${{ fromJSON(needs.readiness.outputs.count) > 6 }}
    - run: python3 scripts/ci/delivery.py publish-wave 6
      if: ${{ fromJSON(needs.readiness.outputs.count) > 6 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth6.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth7
      if: ${{ fromJSON(needs.readiness.outputs.count) > 7 }}
    - run: python3 scripts/ci/delivery.py publish-wave 7
      if: ${{ fromJSON(needs.readiness.outputs.count) > 7 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth7.outputs.token }}
    needs: readiness
    environment: release
    permissions:
      contents: read
      id-token: write
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - run: npm install --global npm@11.16.0
    - run: python3 scripts/ci/delivery.py publish-npm
    needs:
    - readiness
    - crates
    environment: release
    permissions:
      contents: read
      id-token: write
