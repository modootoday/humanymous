name: release

# SoT-31 R6 — publish the engine + Gate images to ghcr.io on a semver tag so
# adopters `compose up` a pulled image instead of building from source. The `red`
# attacker image is NEVER published.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write        # push to ghcr.io
  id-token: write        # cosign keyless (OIDC)

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: build/core.Dockerfile
          - name: gate
            dockerfile: build/gate.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3          # arm64 emulation fallback
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64      # Dockerfiles cross-compile via TARGETARCH
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max                     # SLSA provenance attestation
          sbom: true                               # SPDX SBOM attestation
      - uses: sigstore/cosign-installer@v3
      - name: Sign the pushed image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name }}@${{ steps.build.outputs.digest }}

  gh-release:
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with auto notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
