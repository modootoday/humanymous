# Authored workflow; canon: .spec/sot/delivery.sot.md
name: Release / Publish
'on':
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust-validation.yml
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: node-native-${{ github.sha }}
        path: .
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- release
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- crate-waves
      id: waves
    needs: validate
    outputs:
      count: ${{ steps.waves.outputs.count }}
  images:
    needs: readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: runtime
          dockerfile: build/rust/runtime-candidate.Dockerfile
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - name: Recheck source and candidate shipping qualification
      run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- image-sources
    - name: Bind exact source manifest
      id: image-source
      run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- image-scan prepare
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name }}
        flavor: 'latest=true

          '
        tags: 'type=semver,pattern={{version}}

          type=semver,pattern={{major}}.{{minor}}

          type=semver,pattern={{major}}

          type=sha,format=long

          '
    - id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        build-args: |
          HUMANYMOUS_SOURCE_REV=${{ github.sha }}
          HUMANYMOUS_SOURCE_MANIFEST=${{ steps.image-source.outputs.source-manifest-sha256 }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: mode=max
        sbom: true
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
    - name: Sign the pushed image
      run: "cosign sign --yes \\\n  ghcr.io/${{ github.repository_owner }}/humanymous-${{ matrix.name\
        \ }}@${{ steps.build.outputs.digest }}\n"
    - name: Export digest for gate job
      run: "mkdir -p \"${{ runner.temp }}/digests\"\n# build-push outputs digest like sha256:\u2026\n\
        echo -n \"${{ steps.build.outputs.digest }}\" > \"${{ runner.temp }}/digests/${{ matrix.name }}\"\
        \n"
    - name: Upload digest artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: digest-${{ matrix.name }}
        path: ${{ runner.temp }}/digests/${{ matrix.name }}
        if-no-files-found: error
        retention-days: 5
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: release
  images-ok:
    runs-on: ubuntu-24.04
    needs: images
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: digests
        pattern: digest-*
        merge-multiple: true
    - name: Verify exact digest, both platforms, source, SBOM and OIDC signature
      run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- verify-images
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: image-verification-${{ github.sha }}
        path: target/delivery-evidence/image-publication.json
        if-no-files-found: error
    permissions:
      contents: read
      packages: read
  gh-release:
    runs-on: ubuntu-24.04
    needs:
    - images
    - images-ok
    - crates
    - npm
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-binaries-*
        path: release-assets
        merge-multiple: true
    - name: Generate release notes (git-cliff)
      id: notes
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
      with:
        version: v2.13.1
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: RELEASE_NOTES.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create GitHub release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
      with:
        body_path: RELEASE_NOTES.md
        files: release-assets/*
        fail_on_unmatched_files: true
    environment: release
  crates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: validated-crates-${{ github.sha }}
        path: target
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: node-native-${{ github.sha }}
        path: .
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth0
      if: ${{ fromJSON(needs.readiness.outputs.count) > 0 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 0
      if: ${{ fromJSON(needs.readiness.outputs.count) > 0 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth0.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth1
      if: ${{ fromJSON(needs.readiness.outputs.count) > 1 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 1
      if: ${{ fromJSON(needs.readiness.outputs.count) > 1 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth2
      if: ${{ fromJSON(needs.readiness.outputs.count) > 2 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 2
      if: ${{ fromJSON(needs.readiness.outputs.count) > 2 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth3
      if: ${{ fromJSON(needs.readiness.outputs.count) > 3 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 3
      if: ${{ fromJSON(needs.readiness.outputs.count) > 3 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth4
      if: ${{ fromJSON(needs.readiness.outputs.count) > 4 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 4
      if: ${{ fromJSON(needs.readiness.outputs.count) > 4 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth4.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth5
      if: ${{ fromJSON(needs.readiness.outputs.count) > 5 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 5
      if: ${{ fromJSON(needs.readiness.outputs.count) > 5 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth5.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth6
      if: ${{ fromJSON(needs.readiness.outputs.count) > 6 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 6
      if: ${{ fromJSON(needs.readiness.outputs.count) > 6 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth6.outputs.token }}
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth7
      if: ${{ fromJSON(needs.readiness.outputs.count) > 7 }}
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-wave 7
      if: ${{ fromJSON(needs.readiness.outputs.count) > 7 }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth7.outputs.token }}
    needs: [readiness, images-ok]
    environment: crates
    permissions:
      contents: read
      id-token: write
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - run: npm install --global npm@11.16.0
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- publish-npm
    needs:
    - readiness
    - crates
    environment: npm
    permissions:
      contents: read
      id-token: write
