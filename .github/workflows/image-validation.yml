# Build and inspect the existing Rust candidate; never publish it.
name: CI / Images
'on':
  push:
    branches: [codex/image-validation]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: image-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      id: toolchain
      with:
        toolchain: 1.99.1
    - name: Execute delivery contract units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-delivery -j1
    - name: Lint the exact delivery targets
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous-delivery --all-targets -j1 -- -D warnings
    - name: Verify workflow policy
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- policy
  image:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      with:
        cache-binary: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- image-candidates
    - id: runtime_scan_prepare
      run: cargo run --locked -p humanymous-delivery -- image-scan prepare
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      id: runtime_image_build
      with:
        context: .
        file: build/rust/runtime-candidate.Dockerfile
        build-args: |
          HUMANYMOUS_SOURCE_REV=${{ github.sha }}
          HUMANYMOUS_SOURCE_MANIFEST=${{ steps.runtime_scan_prepare.outputs.source-manifest-sha256 }}
        push: false
        load: true
        tags: humanymous-runtime-candidate:validation
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      id: runtime_image_scan
      with:
        cache: 'false'
        image-ref: humanymous-runtime-candidate:validation
        version: v0.70.0
        format: json
        output: target/delivery-image-scan/trivy.json
        list-all-pkgs: 'true'
        scanners: vuln
        exit-code: '1'
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
    - name: Verify nonempty binary inventory and exact image scan
      if: ${{ !cancelled() && steps.runtime_image_build.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- image-scan verify
      env:
        HUMANYMOUS_TRIVY_OUTCOME: ${{ steps.runtime_image_scan.outcome }}
