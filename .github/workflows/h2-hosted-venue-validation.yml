# N06 hosted-venue Cap=1 Specfold (github-hosted Linux only).
# Component Cap green != product; never invent pass_product_clean_room / desktop_as_hosted.
# Specfold burn: push this workflow file on codex/rust (path-filtered) or workflow_dispatch
# once registered on default branch. Refuse ACT / Desktop spoof.
name: CI / H2 hosted venue Cap
'on':
  push:
    branches: [codex/rust]
    paths:
    - .github/workflows/h2-hosted-venue-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h2-hosted-venue-cap-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      id: toolchain
      with:
        toolchain: 1.99.1
    - name: Execute current lab owner units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-lab-runner --bin humanymous-lab-runner -j1
    - name: Execute current delivery receipt units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-delivery -j1
    - name: Compile the Unix runtime actor before Docker
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo check --locked -p humanymous-runtime-pilot --all-targets -j1
    - name: Compile and lint selected Unix Cap targets
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous-lab-runner -p humanymous-runtime-pilot -p humanymous-delivery --all-targets -j1 -- -D warnings
    - name: Verify current workflow policy
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- policy
  cap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - name: Confirm actual github-hosted Linux (refuse ACT)
      run: |
        set -eu
        if [ -n "${ACT:-}" ]; then
          echo "refused: ACT is set; never spoof GITHUB_ACTIONS / Specfold Cap locally"
          exit 1
        fi
        test "${GITHUB_ACTIONS}" = "true"
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ENVIRONMENT}" = "github-hosted"
        echo "actual_hosted_linux venue confirmed"
    - name: Execute Cap=1 humanymous-lab-runner --w2-h2-hosted-venue
      run: |
        set -eu
        mkdir -p target/h2-hosted-venue-cap-evidence
        cargo run --locked -p humanymous-lab-runner -- run --evidence target/h2-hosted-venue-cap-evidence --w2-h2-hosted-venue
