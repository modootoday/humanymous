# Dedicated owned-deployment Go evidence; no publication or deployment.
name: CI / Go component
'on':
  push:
    branches: [codex/go-validation]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: go-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      id: toolchain
      with:
        toolchain: 1.99.1
    - name: Execute current Go owner units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-adapter-go --lib -j1
    - name: Execute Go leaf deployment contract
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-adapter-go --test deployment_contract -j1
    - name: Admit facade default build request
      id: facade_default_admission
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- facade-profile rust-library
    - name: Execute facade default library contract
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.facade_default_admission.outcome == 'success' }}
      run: cargo test --locked -p humanymous --lib --no-default-features -j1
    - name: Admit facade Go build request
      id: facade_go_admission
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- facade-profile rust-library adapter-go
    - name: Execute facade Go library contract
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.facade_go_admission.outcome == 'success' }}
      run: cargo test --locked -p humanymous --lib --no-default-features --features adapter-go -j1
    - name: Execute facade Go external consumer
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.facade_go_admission.outcome == 'success' }}
      run: cargo test --locked -p humanymous --test go_consumer --no-default-features --features adapter-go -j1
    - name: Lint facade default targets
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.facade_default_admission.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous --all-targets --no-default-features -j1 -- -D warnings
    - name: Lint facade Go targets
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.facade_go_admission.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous --all-targets --no-default-features --features adapter-go -j1 -- -D warnings
    - name: Execute current lab owner units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-lab-runner --bin humanymous-lab-runner -j1
    - name: Execute current delivery receipt units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-delivery -j1
    - name: Compile the Unix runtime actor before Docker
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo check --locked -p humanymous-runtime-pilot --all-targets -j1
    - name: Compile and lint all selected Unix targets
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous-adapter-go -p humanymous-lab-runner -p humanymous-runtime-pilot -p humanymous-delivery --all-targets -j1 -- -D warnings
    - name: Verify current workflow policy
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- policy
  product:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - name: Execute actual owned Go eight-case profile
      run: cargo run --locked -p humanymous-delivery -- go-product
