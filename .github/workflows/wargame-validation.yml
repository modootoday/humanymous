# Exact-source generic Docker measurement; required failures remain failures.
name: CI / Wargame
'on':
  push:
    branches: [codex/wargame-validation]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: wargame-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      id: toolchain
      with:
        toolchain: 1.99.1
    - name: Execute attacker and defender pure units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-attacker -p humanymous-defender --lib -j1
    - name: Execute current lab owner units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-lab-runner --bin humanymous-lab-runner -j1
    - name: Execute current delivery receipt units
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo test --locked -p humanymous-delivery -j1
    - name: Compile the Unix runtime actor before Docker
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo check --locked -p humanymous-runtime-pilot --all-targets -j1
    - name: Lint the selected adversarial and receipt boundaries
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo clippy --locked -p humanymous-attacker -p humanymous-defender -p humanymous-lab-runner -p humanymous-runtime-pilot -p humanymous-delivery --all-targets -j1 -- -D warnings
    - name: Verify workflow policy
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- policy
  product:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - name: Execute the existing generic Docker full gate and strict receipt
      run: cargo run --locked -p humanymous-delivery -- pilot docker
