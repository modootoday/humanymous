# Authored workflow; canon: .spec/sot/delivery.sot.md
name: CI / Validate
'on':
  push:
    branches:
    - main
    - codex/rust
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust-validation.yml
