# Authored workflow; canon: .spec/sot/delivery.sot.md
name: Docs / Deploy
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/rust-validation.yml
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      with:
        artifact_name: checked-pages-${{ github.sha }}
      id: deployment
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
