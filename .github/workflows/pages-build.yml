# Authored workflow; canon: .spec/sot/delivery.sot.md
name: Docs / Build
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
      with:
        ruby-version: 3.3.13
        working-directory: docs
        bundler-cache: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - id: source_prepare
      run: cargo run --locked -p humanymous-delivery -- pages-evidence prepare
      working-directory: .
    - id: bundle_install
      run: bundle install --jobs 1
    - id: bundle_audit
      if: ${{ !cancelled() && steps.bundle_install.outcome == 'success' }}
      run: bundle exec bundle-audit check --update
    - id: apex
      if: ${{ !cancelled() && steps.bundle_install.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- validate --source docs --destination "${{ runner.temp }}/pages-apex" --baseurl ''
      working-directory: .
    - id: subpath
      if: ${{ !cancelled() && steps.bundle_install.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- validate --source docs --destination "${{ runner.temp }}/pages-subpath" --baseurl /humanymous
      working-directory: .
    - id: package_apex
      if: ${{ !cancelled() && steps.apex.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- package --source docs --site "${{ runner.temp }}/pages-apex" --archive "${{ github.workspace }}/target/delivery-pages/apex/artifact.tar" --manifest "${{ github.workspace }}/target/delivery-pages/apex/manifest.json" --restored "${{ runner.temp }}/pages-apex-package-restored" --baseurl ''
      working-directory: .
    - id: package_subpath
      if: ${{ !cancelled() && steps.subpath.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- package --source docs --site "${{ runner.temp }}/pages-subpath" --archive "${{ github.workspace }}/target/delivery-pages/subpath/artifact.tar" --manifest "${{ github.workspace }}/target/delivery-pages/subpath/manifest.json" --restored "${{ runner.temp }}/pages-subpath-package-restored" --baseurl /humanymous
      working-directory: .
    - id: archive_apex
      if: ${{ !cancelled() && steps.package_apex.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- archive-check --source docs --archive "${{ github.workspace }}/target/delivery-pages/apex/artifact.tar" --manifest "${{ github.workspace }}/target/delivery-pages/apex/manifest.json" --restored "${{ runner.temp }}/pages-apex-consumer-restored" --baseurl ''
      working-directory: .
    - id: archive_subpath
      if: ${{ !cancelled() && steps.package_subpath.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- archive-check --source docs --archive "${{ github.workspace }}/target/delivery-pages/subpath/artifact.tar" --manifest "${{ github.workspace }}/target/delivery-pages/subpath/manifest.json" --restored "${{ runner.temp }}/pages-subpath-consumer-restored" --baseurl /humanymous
      working-directory: .
    - id: source_finish
      if: ${{ always() && steps.source_prepare.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- pages-evidence finish
      working-directory: .
      env:
        HUMANYMOUS_PAGES_INSTALL: ${{ steps.bundle_install.outcome }}
        HUMANYMOUS_PAGES_AUDIT: ${{ steps.bundle_audit.outcome }}
        HUMANYMOUS_PAGES_APEX: ${{ steps.apex.outcome }}
        HUMANYMOUS_PAGES_SUBPATH: ${{ steps.subpath.outcome }}
        HUMANYMOUS_PAGES_PACKAGE_APEX: ${{ steps.package_apex.outcome }}
        HUMANYMOUS_PAGES_PACKAGE_SUBPATH: ${{ steps.package_subpath.outcome }}
        HUMANYMOUS_PAGES_ARCHIVE_APEX: ${{ steps.archive_apex.outcome }}
        HUMANYMOUS_PAGES_ARCHIVE_SUBPATH: ${{ steps.archive_subpath.outcome }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && github.ref == 'refs/heads/main' && steps.archive_apex.outcome == 'success' && steps.source_finish.outputs.source-unchanged == 'true' }}
      with:
        name: pages-apex-${{ github.sha }}
        path: |
          target/delivery-pages/apex/artifact.tar
          target/delivery-pages/apex/manifest.json
        retention-days: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && github.ref == 'refs/heads/main' && steps.archive_subpath.outcome == 'success' && steps.source_finish.outputs.source-unchanged == 'true' }}
      with:
        name: pages-subpath-${{ github.sha }}
        path: |
          target/delivery-pages/subpath/artifact.tar
          target/delivery-pages/subpath/manifest.json
        retention-days: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: serving_upload
      if: ${{ github.ref == 'refs/heads/main' && steps.source_finish.outcome == 'success' }}
      with:
        name: checked-pages-${{ github.sha }}
        retention-days: 1
        path: target/delivery-pages/apex/artifact.tar
        if-no-files-found: error
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      id: serving_download
      if: ${{ github.ref == 'refs/heads/main' && steps.serving_upload.outcome == 'success' }}
      with:
        name: checked-pages-${{ github.sha }}
        path: ${{ runner.temp }}/pages-serving-download
    - id: serving_roundtrip
      if: ${{ github.ref == 'refs/heads/main' && steps.serving_download.outcome == 'success' }}
      run: cargo run --locked -p humanymous-pages -- archive-check --source docs --archive "${{ runner.temp }}/pages-serving-download/artifact.tar" --manifest "${{ github.workspace }}/target/delivery-pages/apex/manifest.json" --restored "${{ runner.temp }}/pages-serving-consumer-restored" --baseurl ''
      working-directory: .
    - name: Verify source after serving transfer
      id: source_transfer
      if: ${{ always() && github.ref == 'refs/heads/main' && steps.source_prepare.outcome == 'success' }}
      run: cargo run --locked -p humanymous-delivery -- pages-evidence finish
      working-directory: .
      env:
        HUMANYMOUS_PAGES_INSTALL: ${{ steps.bundle_install.outcome }}
        HUMANYMOUS_PAGES_AUDIT: ${{ steps.bundle_audit.outcome }}
        HUMANYMOUS_PAGES_APEX: ${{ steps.apex.outcome }}
        HUMANYMOUS_PAGES_SUBPATH: ${{ steps.subpath.outcome }}
        HUMANYMOUS_PAGES_PACKAGE_APEX: ${{ steps.package_apex.outcome }}
        HUMANYMOUS_PAGES_PACKAGE_SUBPATH: ${{ steps.package_subpath.outcome }}
        HUMANYMOUS_PAGES_ARCHIVE_APEX: ${{ steps.archive_apex.outcome }}
        HUMANYMOUS_PAGES_ARCHIVE_SUBPATH: ${{ steps.archive_subpath.outcome }}
        HUMANYMOUS_PAGES_TRANSFER: ${{ steps.serving_roundtrip.outcome }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && github.ref == 'refs/heads/main' && steps.source_prepare.outcome == 'success' }}
      with:
        name: pages-outcomes-${{ github.sha }}
        path: |
          target/delivery-pages/*.json
          target/delivery-pages/apex/manifest.json
          target/delivery-pages/subpath/manifest.json
        retention-days: 1
        if-no-files-found: error
    env:
      BUNDLE_FROZEN: 'true'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: docs
        shell: bash
