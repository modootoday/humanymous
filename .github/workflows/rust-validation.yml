# Canon: .spec/sot/delivery.sot.md; reproduce with scripts/ci/render_workflows.py
name: Rust validation authority
'on':
  workflow_call: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - run: python -m unittest discover -s scripts/ci -p 'test_*.py'
    - run: python scripts/ci/delivery.py policy
    - run: python scripts/ci/check_action_pins.py
    - run: 'go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

        "$(go env GOPATH)/bin/actionlint" -shellcheck=""'
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: cargo build --workspace --all-targets --locked
    - run: cargo test --workspace --all-targets --locked
    - run: cargo build --workspace --bins --release --locked
    - run: python scripts/ci/delivery.py pilot native
    - run: python scripts/ci/delivery.py native-artifacts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-binaries-${{ matrix.os }}-${{ github.sha }}
        path: target/delivery-artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-${{ matrix.os }}-${{ github.sha }}
        path: target/delivery-evidence/
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo build --workspace --all-targets --locked
    - run: cargo test --workspace --all-targets --locked
    - run: cargo test --manifest-path scripts/ci/docs-review/Cargo.toml --locked
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - run: cargo fmt --manifest-path scripts/ci/docs-review/Cargo.toml -- --check
    - run: cargo clippy --manifest-path scripts/ci/docs-review/Cargo.toml --all-targets --locked -- -D
        warnings
    - run: cargo test --manifest-path scripts/ci/docs-review/Cargo.toml --locked
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - run: cargo build --locked --target wasm32-unknown-unknown -p humanymous-wasm --release
    - run: python3 scripts/ci/delivery.py pilot browser
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: browser-linux-${{ github.sha }}
        path: target/delivery-evidence/
        if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - run: python3 scripts/ci/delivery.py pilot docker
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: docker-linux-${{ github.sha }}
        path: target/delivery-evidence/
        if-no-files-found: error
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - run: python3 scripts/ci/delivery.py image-sources
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: build/${{ matrix.name }}.Dockerfile
        push: false
        load: true
        tags: humanymous-${{ matrix.name }}:validation
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: humanymous-${{ matrix.name }}:validation
        exit-code: '1'
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
    strategy:
      fail-fast: false
      matrix:
        name:
        - core
        - gate
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: python3 scripts/ci/delivery.py package
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - run: python3 scripts/ci/delivery.py node
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo install cargo-audit --version 0.22.2 --locked
    - run: 'mkdir -p target/delivery-evidence

        cargo audit --json > target/delivery-evidence/cargo-audit.json

        cargo audit --file scripts/ci/docs-review/Cargo.lock --json > target/delivery-evidence/docs-tool-audit.json'
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        exit-code: '1'
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        skip-dirs: .git,.spec.local,target,scripts/ci/docs-review/target
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: advisories-${{ github.sha }}
        path: target/delivery-evidence/
        if-no-files-found: error
      if: always()
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/docs-review/Cargo.toml -- .
  pages:
    uses: ./.github/workflows/pages-build.yml
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - run: python3 scripts/ci/delivery.py jobs
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
    if: always()
    needs:
    - policy
    - native
    - msrv
    - quality
    - browser
    - docker
    - images
    - packages
    - node
    - advisories
    - documentation
    - pages
