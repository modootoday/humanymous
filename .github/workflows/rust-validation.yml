# Authored workflow; canon: .spec/sot/delivery.sot.md
name: CI / Rust
'on':
  workflow_call: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
# No cache writes: artifact/cache billing has not been verified for this account.
# Two heavy lanes after policy. Failed checks remain failed while their lane
# continues collecting independent results; cancellation stops both lanes.
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo test --locked --manifest-path scripts/ci/delivery/Cargo.toml
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- policy
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- action-pins
    - run: 'go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

        "$(go env GOPATH)/bin/actionlint" -shellcheck=""'
  native:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - name: Configure Windows native build tools
      if: runner.os == 'Windows'
      run: cargo run --manifest-path scripts/ci/cef-pilot/Cargo.toml --locked -- --configure-toolchain
    - run: cargo build --workspace --all-targets --locked
    - name: Execute every workspace harness through the native Rust actor
      run: cargo run --locked -p humanymous-delivery -- probe ${{ matrix.os == 'windows-2025' && 'windows' || matrix.os == 'macos-15' && 'macos' || 'linux' }} ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
    - name: Preserve native workspace accounting
      if: always() && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-workspace-${{ matrix.os }}-${{ github.sha }}
        path: target/runner-probe/
        if-no-files-found: error
        retention-days: 1
    - run: cargo build --workspace --bins --release --locked
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- pilot native
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- native-artifacts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        name: native-binaries-${{ matrix.os }}-${{ github.sha }}
        path: target/delivery-artifacts/
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-${{ matrix.os }}-${{ github.sha }}
        retention-days: 1
        path: target/delivery-evidence/
        if-no-files-found: error
      if: always() && startsWith(github.ref, 'refs/tags/v')
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-2025
  msrv:
    needs: [policy, native]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo build --workspace --all-targets --locked
    - run: cargo test --workspace --all-targets --locked
    - run: cargo test --manifest-path scripts/ci/docs-review/Cargo.toml --locked
    - run: cargo test --manifest-path scripts/ci/delivery/Cargo.toml --locked
  quality:
    needs: [policy, msrv]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - run: cargo fmt --manifest-path scripts/ci/docs-review/Cargo.toml -- --check
    - run: cargo clippy --manifest-path scripts/ci/docs-review/Cargo.toml --all-targets --locked -- -D
        warnings
    - run: cargo test --manifest-path scripts/ci/docs-review/Cargo.toml --locked
    - run: cargo fmt --manifest-path scripts/ci/delivery/Cargo.toml -- --check
    - run: cargo clippy --manifest-path scripts/ci/delivery/Cargo.toml --all-targets --locked -- -D warnings
  browser:
    needs: [policy, docker]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
        package-manager-cache: false
    - run: cargo build --locked --target wasm32-unknown-unknown -p humanymous-collector --release
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- pilot browser
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: browser-linux-${{ github.sha }}
        retention-days: 1
        path: target/delivery-evidence/
        if-no-files-found: error
      if: always() && startsWith(github.ref, 'refs/tags/v')
  docker:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      with:
        cache-binary: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- pilot docker
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: docker-linux-${{ github.sha }}
        retention-days: 1
        path: target/delivery-evidence/
        if-no-files-found: error
      if: always() && startsWith(github.ref, 'refs/tags/v')
  images:
    needs: [policy, browser]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      with:
        cache-binary: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- image-sources
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: build/${{ matrix.name }}.Dockerfile
        push: false
        load: true
        tags: humanymous-${{ matrix.name }}:validation
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        cache: 'false'
        image-ref: humanymous-${{ matrix.name }}:validation
        exit-code: '1'
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        name:
        - core
        - gate
  packages:
    needs: [policy, images]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- package
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        name: validated-crates-${{ github.sha }}
        retention-days: 1
        path: |
          target/package/*.crate
          target/delivery-crates/validated-archives.json
        if-no-files-found: error
  node:
    needs: [policy, packages]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- node
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && startsWith(github.ref, 'refs/tags/v')
      with:
        name: node-native-${{ github.sha }}
        retention-days: 1
        path: |
          target/node-native/
          target/delivery-node/
          adapters/node/native/provenance.json
        if-no-files-found: error
  advisories:
    needs: [policy, node]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo install cargo-audit --version 0.22.2 --locked
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- audit-closure
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        cache: 'false'
        scan-type: fs
        scan-ref: .
        exit-code: '1'
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        skip-dirs: .git,.spec.local,target,scripts/ci/docs-review/target
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: advisories-${{ github.sha }}
        retention-days: 1
        path: target/delivery-evidence/
        if-no-files-found: error
      if: always() && startsWith(github.ref, 'refs/tags/v')
  documentation:
    needs: [policy, quality]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/docs-review/Cargo.toml -- .
  pages:
    needs: [policy, documentation]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    uses: ./.github/workflows/pages-build.yml
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
    - run: cargo run --locked --manifest-path scripts/ci/delivery/Cargo.toml -- jobs
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
    if: always()
    needs:
    - policy
    - native
    - msrv
    - quality
    - browser
    - docker
    - images
    - packages
    - node
    - advisories
    - documentation
    - pages
