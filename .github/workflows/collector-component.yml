name: CI / Collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'web/js/features/mouse.js'
      - 'web/js/features/keystroke.js'
      - 'web/js/advanced.js'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/rust/collector-browser.Dockerfile*'
      - 'deployments/lab/compose.collector.yaml'
      - 'deployments/lab/topology/sandbox.yaml'
      - '.github/workflows/collector-component.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'web/js/features/mouse.js'
      - 'web/js/features/keystroke.js'
      - 'web/js/advanced.js'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/rust/collector-browser.Dockerfile*'
      - 'deployments/lab/compose.collector.yaml'
      - 'deployments/lab/topology/sandbox.yaml'
      - '.github/workflows/collector-component.yml'
permissions:
  contents: read
concurrency:
  group: collector-component-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  firefox-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate isolated component topology
        run: docker compose -f deployments/lab/compose.collector.yaml --profile collector config --quiet
      - name: Build pinned Rust and browser tools
        run: docker compose -f deployments/lab/compose.collector.yaml --profile collector build
      - name: Execute actual browser WASM tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/collector-evidence
          docker image inspect humanymous/collector-browser:local > target/collector-evidence/image.json
          docker compose -f deployments/lab/compose.collector.yaml --profile collector run --rm --no-deps collector-browser 2>&1 | tee target/collector-evidence/browser-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.CI_COMPONENT_ARTIFACTS == 'true'
        with:
          name: collector-component-${{ github.sha }}
          path: target/collector-evidence/
          if-no-files-found: warn
          retention-days: 1
