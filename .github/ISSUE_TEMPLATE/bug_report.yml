name: Bug report
description: Report a defect in humanymous (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **Do not use this form for security vulnerabilities.** If you have found a
        security issue (a detection bypass, an admin-plane weakness, audit-chain
        tampering, etc.), report it privately per [SECURITY.md](../blob/main/SECURITY.md)
        instead — do not open a public issue.
  - type: checkboxes
    id: preconditions
    attributes:
      label: Preconditions
      options:
        - label: This is not a security vulnerability (those go through SECURITY.md, privately).
          required: true
        - label: I searched existing issues and this has not already been reported.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I …, Gate returned …, but I expected …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps. Include exact commands where possible.
      placeholder: |
        1. `docker compose -f deployments/compose.yaml up -d core origin gate`
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Detection engine / Core
        - Gate (reverse-proxy edge / admin plane)
        - humanymous Pass (challenge)
        - WASM / JS loader
        - Audit chain / integrity
        - Build / CI / tooling
        - Docs
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The tag or commit SHA you are running.
      placeholder: v0.1.0 or a git SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version (`go version`), Docker version, and how you are running it.
      placeholder: |
        - OS:
        - Go:
        - Docker:
        - Run mode: loopback / Docker lab / other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste logs, error messages, or failing assertions. Redact any real identifiers.
      render: shell
    validations:
      required: false
