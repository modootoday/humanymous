[workspace]
members = ["crates/attacker", "crates/audit", "crates/behavior", "crates/challenge", "crates/cli", "crates/defender", "crates/integrity", "crates/model", "crates/network", "crates/scoring", "crates/signals", "crates/test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/modootoday/humanymous"

[workspace.dependencies]
humanymous-signals = { path = "crates/signals", version = "0.1.0" }
humanymous-behavior = { path = "crates/behavior", version = "0.1.0" }
humanymous-model = { path = "crates/model", version = "0.1.0" }
humanymous-test-support = { path = "crates/test-support", version = "0.1.0" }
hmac = "0.12.1"
sha2 = "0.10.9"
md-5 = "0.11.0"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
base64 = "0.22.1"
subtle = "2.6.1"
# Unicode 15 data is part of historical audit hashes; upgrades require parity.
unicode-normalization = "=0.1.22"
ed25519-dalek = "3.0.0"
fs4 = "1.1.0"
getrandom = "0.4.3"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
