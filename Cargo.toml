[workspace]
members = ["crates/challenge", "crates/integrity"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/modootoday/humanymous"

[workspace.dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
subtle = "2.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
