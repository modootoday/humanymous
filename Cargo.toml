[workspace]
members = [
  "crates/humanymous",
  "crates/sdk/humanymous-core",
  "crates/integrations/humanymous-platform",
  # Shared security and service contexts.
  "crates/sdk/humanymous-runtime",
  "crates/collector",
  # Native host and framework boundaries.
  "crates/apache-adapter", "crates/apache-adapter/native",
  "crates/dotnet-adapter", "crates/dotnet-adapter/export", "crates/framework-adapter",
  "crates/go-adapter", "crates/native-abi", "crates/native-abi/export", "crates/nginx-adapter",
  "crates/node-adapter", "crates/python-adapter", "crates/ruby-adapter",
  # Desktop and native operating-system integration.
  "crates/browser", "crates/browser/native/bootstrap", "crates/browser/native/desktop",
  "crates/cli", "crates/native-cli",
  # Qualification, delivery and authoring tools.
  "crates/attacker", "crates/defender", "docs/tooling",
  "scripts/ci/delivery", "skills/agent-maintenance", "test/lab/runner", "test/lab/runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/modootoday/humanymous"

[workspace.dependencies]
humanymous-platform = { path = "crates/integrations/humanymous-platform", version = "0.1.0", default-features = false }
humanymous-core = { path = "crates/sdk/humanymous-core", version = "0.1.0" }
humanymous-runtime = { path = "crates/sdk/humanymous-runtime", version = "0.1.0", default-features = false }
hmac = "0.12.1"
sha2 = "0.10.9"
md-5 = "0.11.0"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
base64 = "0.22.1"
subtle = "2.6.1"
# Unicode 15 data is part of historical audit hashes; upgrades require parity.
unicode-normalization = "=0.1.22"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
scrypt = { version = "0.12.0", default-features = false }
zeroize = { version = "1.9.1", features = ["serde"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Opt-in local edit loop. CI/default/release profiles retain their own settings.
# CARGO_INCREMENTAL=0 overrides this profile; unset it or explicitly choose 1.
[profile.local-edit]
inherits = "dev"
debug = "line-tables-only"
incremental = true
