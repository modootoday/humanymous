[package]
name = "humanymous-runtime-pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
humanymous-runtime = { workspace = true, features = ["audit", "gateway"] }
humanymous-core.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
humanymous-attacker = {path="../../../crates/attacker"}
humanymous-defender = {path="../../../crates/defender"}
ed25519-dalek.workspace = true
serde.workspace = true
zeroize.workspace = true
tokio.workspace = true
humanymous-platform = { workspace = true, features = ["testing"] }
humanymous = {path="../../../crates/humanymous", default-features=false, features=["adapter-go"]}

# Clears close-on-exec on the two witness pipe ends the shipped runtime inherits
# (unsafe_code is forbidden, so no pre_exec hook). Same version and features as
# humanymous-runtime, so no new crate enters the lock.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }

[lints.rust]
unsafe_code = "forbid"
