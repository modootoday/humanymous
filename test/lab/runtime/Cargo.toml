[package]
name = "humanymous-runtime-pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
humanymous-runtime = { workspace = true, features = ["audit", "gateway"] }
humanymous-core.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
humanymous-attacker = {path="../../../crates/attacker"}
humanymous-defender = {path="../../../crates/defender"}
ed25519-dalek.workspace = true
serde.workspace = true
zeroize.workspace = true
tokio.workspace = true
humanymous-platform = { workspace = true, features = ["testing"] }
humanymous = {path="../../../crates/humanymous", default-features=false, features=["adapter-go"]}
# Roadmap 2a TLS client and in-container lab CA; same pins as humanymous-runtime.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
httlib-hpack = "=0.1.3"

[lints.rust]
unsafe_code = "forbid"
