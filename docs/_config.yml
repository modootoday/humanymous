# GitHub Pages / Jekyll config for the humanymous documentation.
# Serve this folder as the site: repo Settings → Pages → Source: "Deploy from a
# branch" → Branch: main, Folder: /docs. Jekyll then treats /docs as the site root
# and this file as its configuration.

title: humanymous — Documentation
description: >-
  Defensive anti-bot / browser-automation detection. Docs for the detection
  Core, the Gate reverse proxy, and the Detection Observatory.
lang: en

# Custom domain (GitHub Pages reads docs/CNAME). Apex serves /docs as the site
# root, so baseurl is empty and url is the bare domain.
url: https://humanymous.net
baseurl: ""

# ── SEO / AEO / GEO metadata ────────────────────────────────────────────────
# Read by jekyll-seo-tag (title/description/canonical/OpenGraph/Twitter + JSON-LD)
# and jekyll-sitemap (/sitemap.xml). Together with the per-page TechArticle JSON-LD,
# robots.txt and llms.txt, this makes the docs legible to search engines, answer
# engines, and generative/LLM crawlers alike.
author:
  name: The humanymous Authors
logo: /assets/brand/mark.svg
twitter:
  card: summary
social:
  name: humanymous
  links:
    - https://github.com/modootoday/humanymous
repository: modootoday/humanymous
# Keywords surfaced in the homepage structured data (answer/generative engines).
keywords: >-
  anti-bot detection, browser automation detection, bot management, JA3, JA4, TLS
  fingerprint, HTTP/2 fingerprint, reverse proxy WAF, behavioral biometrics,
  headless browser detection, Selenium Puppeteer Playwright detection, Go, WebAssembly

# No external theme: the site ships its own brand layout + stylesheet (SoT-34/33
# design system, shared with the console and demo). _layouts/default.html + the
# @layer stylesheet at assets/css/humanymous.css replace jekyll-theme-cayman.
# Apply that layout to EVERY page (the pages carry only a title in front matter, or
# none, so a defaults rule is what wraps them in the brand shell).
defaults:
  - scope: { path: "" }
    values: { layout: default }

# README.md now carries SEO front matter (description/keywords). jekyll-readme-index
# skips READMEs that already have front matter unless told otherwise, so without this
# the site root (/) 404s while /README.html still renders. Promote it regardless.
readme_index:
  with_frontmatter: true

# These are GitHub Pages default plugins and are active automatically; listed
# here for clarity. They are why this doc set renders correctly as-is:
#   jekyll-optional-front-matter — the ~40 pages without YAML front matter still
#     render to HTML (Jekyll would otherwise skip them).
#   jekyll-relative-links        — Markdown links like [x](foo.md) resolve to the
#     rendered foo.html, so the cross-doc links keep working.
#   jekyll-readme-index          — README.md is served as the folder index.
#   jekyll-titles-from-headings  — a page <title> is taken from its first H1.
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-titles-from-headings
  # SEO/AEO/GEO — both are GitHub-Pages-whitelisted (no Gemfile needed):
  - jekyll-seo-tag   #  {% seo %} → title/description/canonical/OpenGraph/Twitter + JSON-LD
  - jekyll-sitemap   #  auto /sitemap.xml on every build (referenced by robots.txt)

# Nothing to exclude: serving from /docs means only this folder is the site, so
# the internal Korean SoT specs, cmd/, and internal/ are never rendered.
# Keep build artifacts and the screenshot utility out if they ever land here:
exclude:
  - "*.mjs"

# Jekyll excludes dotfiles/dirs by default; force-include the RFC 9116 security
# contact so it is served at https://humanymous.net/.well-known/security.txt.
include:
  - ".well-known"
