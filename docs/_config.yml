title: humanymous
description: A reference implementation for raising automation cost, with explicit limits and accessible recovery.
url: https://humanymous.net
baseurl: ""
repository: modootoday/humanymous
lang: en
# v1.5.0, verified tag SHA below.
remote_theme: modootoday/jekyll-theme-modootoday@ba2b23f0e1639f92ccefbb882f43092bfe5b16b7
markdown: kramdown
kramdown: {input: GFM, syntax_highlighter: rouge}
sass: {silence_deprecations: [import, global-builtin], sourcemap: never}
permalink: pretty
plugins: [jekyll-remote-theme, jekyll-relative-links, jekyll-seo-tag, jekyll-sitemap]
defaults:
  - scope: {path: ""}
    values: {layout: doc, twin: false}
modootoday:
  twins: false
  logo: /assets/brand/mark.svg
  favicon: /assets/brand/favicon.svg
exclude: [AGENTS.md, INTEGRATION.md, Gemfile, Gemfile.lock, reviews.json, scripts, tooling, vendor, .bundle, _site, assets/og, assets/llms, assets/screenshots, images]
include: [.well-known]
